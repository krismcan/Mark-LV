name: P92 Native CSharp Fake Monitor Race Tests (NO CUSTODY EFFECTS)

on:
  push:
    branches:
      - byok-c1-p92-native-monitor-fake-20261107

permissions:
  contents: read

jobs:
  windows-concurrency-fake:
    name: Windows .NET Framework fake-only x${{ matrix.arch }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: '64'
            csc: 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
            platform: 'x64'
            python-version: '3.12'
          - arch: '86'
            csc: 'C:\Windows\Microsoft.NET\Framework\v4.0.30319\csc.exe'
            platform: 'x86'
            python-version: '3.14'
    steps:
      - name: Set up Python for existing isolated affected tests
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Clone exact review branch and authenticate parent/scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git -c core.autocrlf=false clone --quiet --single-branch --branch byok-c1-p92-native-monitor-fake-20261107 https://github.com/krismcan/Mark-LV.git reviewed
          if ($LASTEXITCODE -ne 0) { throw 'P92 clone failed' }
          git -C reviewed config --local core.autocrlf false
          $head = (git -C reviewed rev-parse HEAD).Trim()
          $parent = (git -C reviewed rev-list --parents -n 1 HEAD).Trim()
          if ($head -ne $env:GITHUB_SHA) { throw 'P92 trigger SHA drift' }
          if ($parent -ne ($head + ' 04ad14b8eb9632c6443b1f44ca603a6a7b2fffa4')) { throw 'P92 parent not exact P91' }
          $allowed = @('.github/workflows/p92-disabled-native-fake-monitor.yml',
                       'tests/p92_disabled_native_monitor/DisabledAdmissionMonitor.cs',
                       'tests/p92_disabled_native_monitor/FakeMonitorTests.cs') | Sort-Object
          $actual = @(git -C reviewed diff-tree --no-commit-id --name-only -r HEAD | Sort-Object)
          if (@(Compare-Object -ReferenceObject $allowed -DifferenceObject $actual).Count -ne 0) { throw 'Unapproved source changes' }
          git -C reviewed diff --check HEAD^ HEAD
          if ($LASTEXITCODE -ne 0) { throw 'P92 diff whitespace issue' }
          if (@(git -C reviewed status --porcelain=v1 --untracked-files=all).Count -ne 0) { throw 'Dirty clone' }
          Write-Output "P92_VERIFIED_HEAD=$head"
          Write-Output 'P92_P91_HISTORY_UNTOUCHED=TRUE'
      - name: Compile clean test-only CSharp and run 22 native thread tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = '${{ matrix.csc }}'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Native CSharp Framework compiler unavailable' }
          # Legacy .NET Framework csc resolves relative source paths from its
          # own compiler context on GitHub runners. Use absolute paths.
          $a=(Resolve-Path -LiteralPath 'reviewed/tests/p92_disabled_native_monitor/DisabledAdmissionMonitor.cs').Path
          $b=(Resolve-Path -LiteralPath 'reviewed/tests/p92_disabled_native_monitor/FakeMonitorTests.cs').Path
          $source = Get-Content -Raw -LiteralPath $a
          if ($source -match 'DllImport|CredWrite|CredDelete|CredRead|System.Runtime.InteropServices|WindowsIdentity|RegistryKey') { throw 'Native credential capability in fake source' }
          $exe=Join-Path $env:RUNNER_TEMP ('P92_FakeMonitor_${{ matrix.platform }}.exe')
          & $compiler /nologo /target:exe '/platform:${{ matrix.platform }}' "/out:$exe" $a $b
          if ($LASTEXITCODE -ne 0) { throw 'CSharp compilation failed' }
          Write-Output 'P92_NATIVE_CSHARP_COMPILATION_EXIT=0'
          for ($i=1; $i -le 10; $i++) {
            $result=(& $exe 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0 -or $result -notmatch 'P92_FAKE_NATIVE_MONITOR_PASSED=22' -or $result -notmatch 'P92_FAKE_NATIVE_MONITOR_FAILED=0' -or $result -notmatch 'P92_BYOK_C1_PRODUCTION_RELEASE=HOLD') { throw 'P92 race test failed or wrong run count' }
          }
          Write-Output 'P92_CSHARP_NATIVE_RUNS=10'
          Write-Output 'P92_CSHARP_NATIVE_TEST_CASE_EXECUTIONS=220'
          Write-Output 'P92_CSHARP_NATIVE_EXIT=0'
      - name: Preserve affected Python Windows regression behavior
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location reviewed
          try {
            python -B -m unittest -q tests.test_p91_disabled_admission_model tests.test_p88_pending_observation_lifecycle tests.test_p87_readonly_custody_observation tests.test_p86_live_pending_status_integration tests.test_pending_custody_status_view tests.test_first_run_connection_application tests.test_first_run_connection_window tests.test_first_run_connection_effect_isolation tests.test_phase_830_workspace tests.test_phase_831_workspace tests.test_first_run_connection_cancelled_effect
            if ($LASTEXITCODE -ne 0) { throw 'Historical affected tests failed' }
            Write-Output 'P92_AFFECTED_PYTHON_NATIVE_EXIT=0'
          } finally { Pop-Location }
      - name: Final release and worktree hold
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git -C reviewed rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Source HEAD changed' }
          if (@(git -C reviewed status --porcelain=v1 --untracked-files=all).Count -ne 0) { throw 'Checkout modified' }
          Write-Output 'P92_NATIVE_CREDENTIAL_DISPATCH=NONE'
          Write-Output 'P92_P62_SAFETY_HOLD=UNCHANGED'
          Write-Output 'P92_INDEPENDENT_SECURITY_REVIEW=NOT_RECEIVED'
          Write-Output 'P92_C1_PRODUCTION_RELEASE=HOLD'
