name: P297 hosted in-memory synthetic review

on:
  pull_request:
    branches: [byok-c1-p296-launch-custody-diagnostic-20261122]
    types: [opened, synchronize, reopened, converted_to_draft]

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'

defaults:
  run:
    shell: pwsh

jobs:
  synthetic:
    if: >-
      github.repository == 'krismcan/Mark-LV' &&
      github.repository_owner == 'krismcan' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.base.repo.full_name == 'krismcan/Mark-LV' &&
      github.event.pull_request.head.repo.full_name == 'krismcan/Mark-LV' &&
      github.event.pull_request.head.repo.owner.login == 'krismcan' &&
      github.event.pull_request.base.ref == 'byok-c1-p296-launch-custody-diagnostic-20261122' &&
      github.event.pull_request.base.sha == '45010901a7d1bd28fff03c83449c23d596c18bbd' &&
      github.event.pull_request.head.ref == 'byok-c1-p297-hosted-synthetic-evidence-20261122'
    runs-on: windows-2022
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
        trial: [1, 2]
    env:
      P297_ARCH: ${{ matrix.arch }}
      P297_TRIAL: ${{ matrix.trial }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 3
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Review exact sources and run only hosted synthetic entry
        run: ./tests/p297_hosted_synthetic/HostedReview.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p297-synthetic-${{ matrix.arch }}-trial-${{ matrix.trial }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/p297-evidence-${{ matrix.arch }}-${{ matrix.trial }}/summary.txt
            ${{ runner.temp }}/p297-evidence-${{ matrix.arch }}-${{ matrix.trial }}/source-before.sha256
            ${{ runner.temp }}/p297-evidence-${{ matrix.arch }}-${{ matrix.trial }}/source-after.sha256
