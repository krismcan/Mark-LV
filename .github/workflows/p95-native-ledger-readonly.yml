name: P95 Authentic Native CSharp Ledger Read-Only Review (C1 HOLD)

on:
  push:
    branches:
      - byok-c1-p95-native-ledger-readonly-20261107

permissions:
  contents: read

jobs:
  native-ledger:
    name: Native genuine ledger / Windows ${{ matrix.arch }} / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            csc: 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
            platform: x64
            python-version: '3.12'
          - arch: x86
            csc: 'C:\Windows\Microsoft.NET\Framework\v4.0.30319\csc.exe'
            platform: x86
            python-version: '3.14'
    steps:
      - name: Prepare pinned Windows Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify exact direct P93 child, five-file source inventory and original native codec SHA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git -c core.autocrlf=false clone --quiet --single-branch --branch byok-c1-p95-native-ledger-readonly-20261107 https://github.com/krismcan/Mark-LV.git reviewed
          if ($LASTEXITCODE -ne 0) { throw 'P95 clone failed' }
          git -C reviewed config --local core.autocrlf false
          $head=(git -C reviewed rev-parse HEAD).Trim()
          $parents=(git -C reviewed rev-list --parents -n 1 HEAD).Trim()
          if ($head -ne $env:GITHUB_SHA) { throw 'P95 exact trigger commit mismatch' }
          if ($parents -ne ($head + ' 8d4b02b0a61b974e4bf2083ed42929484d058909')) { throw 'P95 exact sole P93 parent mismatch' }
          $expected=@('.github/workflows/p95-native-ledger-readonly.yml',
                      'docs/byok-c1-p95-native-ledger-review.md',
                      'tests/p95_native_custody_preflight/CustodyLedger.cs',
                      'tests/p95_native_custody_preflight/NativeLedgerPreflight.cs',
                      'tests/p95_native_custody_preflight/NativeLedgerPreflightTests.cs') | Sort-Object
          $actual=@(git -C reviewed diff-tree --no-commit-id --name-only -r HEAD | Sort-Object)
          if (@(Compare-Object -ReferenceObject $expected -DifferenceObject $actual).Count -ne 0) { throw 'Unapproved P95 path delta' }
          git -C reviewed diff --check HEAD^ HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace diff invalid' }
          if (@(git -C reviewed status --porcelain=v1 --untracked-files=all).Count -ne 0) { throw 'P95 source checkout dirty' }
          $native=(Resolve-Path -LiteralPath 'reviewed/tests/p95_native_custody_preflight/CustodyLedger.cs').Path
          $sha=(Get-FileHash -Algorithm SHA256 -LiteralPath $native).Hash
          if ($sha -ne '93A5EEEC6EE6CC4F6FFF5146B5709F57CBDD37559D62DE0BD4691BF678D5CE0B') { throw 'Imported authentic native CSharp codec drift' }
          Write-Output "P95_VERIFIED_HEAD=$head"
          Write-Output "P95_ORIGINAL_NATIVE_CSHARP_SHA256=$sha"
      - name: Compile genuine CSharp native ledger with separate denial-only preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = '${{ matrix.csc }}'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'CSharp Framework compiler unavailable' }
          $dir = (Resolve-Path -LiteralPath 'reviewed/tests/p95_native_custody_preflight').Path
          $sourceA=Join-Path $dir 'CustodyLedger.cs'
          $sourceB=Join-Path $dir 'NativeLedgerPreflight.cs'
          $sourceC=Join-Path $dir 'NativeLedgerPreflightTests.cs'
          $source=Get-Content -LiteralPath $sourceB -Raw
          if ($source -match 'DllImport|CredWrite|CredDelete|CredRead|ServiceBase|System.Runtime.InteropServices|WindowsIdentity|RegistryKey') { throw 'Prohibited native effect in review-only preflight' }
          $exe=Join-Path $env:RUNNER_TEMP ('P95_NativeLedger_${{ matrix.arch }}.exe')
          & $compiler /nologo /target:exe '/platform:${{ matrix.platform }}' "/out:$exe" $sourceA $sourceB $sourceC
          if ($LASTEXITCODE -ne 0) { throw 'Actual native CSharp ledger compilation failed' }
          Write-Output 'P95_NATIVE_CSHARP_COMPILATION_EXIT=0'
          for ($i=1; $i -le 5; $i++) {
            $result=(& $exe 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0 -or $result -notmatch 'P95_NATIVE_LEDGER_READONLY_PASSED=34' -or
                $result -notmatch 'P95_NATIVE_LEDGER_READONLY_FAILED=0' -or
                $result -notmatch 'P95_PRODUCTION_RELEASE=HOLD') { throw 'P95 native ledger regression failure' }
          }
          Write-Output 'P95_NATIVE_LEDGER_RUNS=5'
          Write-Output 'P95_NATIVE_LEDGER_CASE_EXECUTIONS=170'
          Write-Output 'P95_NATIVE_LEDGER_EXEC_EXIT=0'
      - name: Run existing real crash/codec and affected Python Windows regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location reviewed
          try {
            python -B -m unittest -q tests.test_p93_disposable_crash_recovery tests.test_pending_credential_recovery_document tests.test_p91_disabled_admission_model tests.test_p88_pending_observation_lifecycle tests.test_p87_readonly_custody_observation tests.test_p86_live_pending_status_integration tests.test_pending_custody_status_view tests.test_first_run_connection_application tests.test_first_run_connection_window tests.test_first_run_connection_effect_isolation tests.test_phase_830_workspace tests.test_phase_831_workspace tests.test_first_run_connection_cancelled_effect
            if ($LASTEXITCODE -ne 0) { throw 'Affected Python Windows product tests failed' }
            Write-Output 'P95_AFFECTED_PYTHON_NATIVE_EXIT=0'
          } finally { Pop-Location }
      - name: Explicit no-effect and release HOLD disposition
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git -C reviewed rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'HEAD mutated' }
          if (@(git -C reviewed status --porcelain=v1 --untracked-files=all).Count -ne 0) { throw 'Checkout altered' }
          Write-Output 'P95_NATIVE_WIN_CRED=NOT_CALLED'
          Write-Output 'P95_OS_PROTECTED_CUSTODY=NOT_OBSERVED'
          Write-Output 'P95_INDEPENDENT_SECURITY_REVIEW=NOT_RECEIVED'
          Write-Output 'P95_BYOK_C1_PRODUCTION_RELEASE=HOLD'
