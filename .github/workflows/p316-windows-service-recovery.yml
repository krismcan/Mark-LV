name: P316 read-only service startup recovery
on:
  pull_request:
    types: [opened, synchronize, reopened, converted_to_draft]
    branches: [byok-c1-p315-hosted-crash-recovery-20261123]
permissions:
  contents: read
jobs:
  vault:
    if: github.event.pull_request.draft == true && github.repository == 'krismcan/Mark-LV' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository && github.head_ref == 'byok-c1-p316-service-recovery-boundary-20261124' && github.base_ref == 'byok-c1-p315-hosted-crash-recovery-20261123' && github.event.pull_request.base.sha == '1e1c0f80e75d1d3e49f1e3135ea3546c77e65a14'
    runs-on: windows-2022
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
        configuration: [Debug, Release]
    env:
      BUILD_ARCH: ${{ matrix.arch }}
      BUILD_CONFIGURATION: ${{ matrix.configuration }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Validate exact draft before checkout
        run: |
          $ErrorActionPreference = 'Stop'
          $temp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
          $eventPath = [IO.Path]::GetFullPath($env:GITHUB_EVENT_PATH)
          if (!$eventPath.StartsWith($temp + '\', [StringComparison]::OrdinalIgnoreCase)) { throw 'Event location HOLD' }
          for ($path = $eventPath; $path; $path = [IO.Path]::GetDirectoryName($path)) {
            $item = Get-Item -LiteralPath $path -Force
            if ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Reparse event HOLD' }
            if ($path.TrimEnd('\') -ieq $temp) { break }
          }
          $file = Get-Item -LiteralPath $eventPath -Force
          if ($file.PSIsContainer -or $file.Length -le 0 -or $file.Length -ge 65536) { throw 'Event file HOLD' }
          $eventData = Get-Content -Raw -LiteralPath $eventPath | ConvertFrom-Json
          $p = $eventData.pull_request
          # A forked root is allowed only with the same exact repository ID/name.
          if ($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_OS -cne 'Windows' -or
              $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:GITHUB_EVENT_NAME -cne 'pull_request' -or
              $env:GITHUB_REPOSITORY -cne 'krismcan/Mark-LV' -or
              $env:GITHUB_HEAD_REF -cne 'byok-c1-p316-service-recovery-boundary-20261124' -or
              $env:GITHUB_BASE_REF -cne 'byok-c1-p315-hosted-crash-recovery-20261123' -or
              ($p.draft -isnot [bool]) -or $p.draft -cne $true -or $eventData.repository.full_name -cne 'krismcan/Mark-LV' -or
              ($eventData.repository.fork -isnot [bool]) -or $eventData.repository.fork -cne $true -or ($p.head.repo.fork -isnot [bool]) -or ($p.base.repo.fork -isnot [bool]) -or $p.head.repo.fork -cne $eventData.repository.fork -or $p.base.repo.fork -cne $eventData.repository.fork -or
              $p.head.repo.full_name -cne 'krismcan/Mark-LV' -or $p.base.repo.full_name -cne 'krismcan/Mark-LV' -or
              $eventData.repository.id -ne 1402212689 -or $p.head.repo.id -ne $eventData.repository.id -or $p.base.repo.id -ne $eventData.repository.id -or
              $p.head.ref -cne 'byok-c1-p316-service-recovery-boundary-20261124' -or
              $p.base.ref -cne 'byok-c1-p315-hosted-crash-recovery-20261123' -or
              $p.base.sha -cne '1e1c0f80e75d1d3e49f1e3135ea3546c77e65a14' -or
              $p.head.sha -cnotmatch '\A[0-9a-f]{40}\z' -or $p.head.sha -ceq $p.base.sha) { throw 'P316 draft event HOLD' }
          if ((Test-Path Env:P312_SYNTHETIC_HOSTED_ONLY) -or (Test-Path Env:P313_SYNTHETIC_HOSTED_ONLY) -or (Test-Path Env:P314_SYNTHETIC_HOSTED_ONLY) -or (Test-Path Env:P315_SYNTHETIC_HOSTED_ONLY) -or (Test-Path Env:P316_SYNTHETIC_HOSTED_ONLY)) { throw 'Historical flags forbidden' }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Prove source, compile actual assembly and run isolated friend tests
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-Location).Path
          $p = (Get-Content -Raw -LiteralPath $env:GITHUB_EVENT_PATH | ConvertFrom-Json).pull_request
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -cne $p.head.sha) { throw 'Checkout HOLD' }
          $base = '1e1c0f80e75d1d3e49f1e3135ea3546c77e65a14'
          git merge-base --is-ancestor $base $head
          if ($LASTEXITCODE -ne 0) { throw 'Ancestry HOLD' }
          if ($env:BUILD_ARCH -cnotin @('x64', 'x86') -or $env:BUILD_CONFIGURATION -cnotin @('Debug', 'Release')) { throw 'Build shape HOLD' }
          $inputs = @('src/Nayeon.ByokC1.Service/CustodyService.cs',
            'src/Nayeon.ByokC1.Service/Nayeon.ByokC1.Service.csproj',
            'src/Nayeon.ByokC1.Service/ServiceRecoveryBoundary.cs',
            'tests/p316_service_recovery/P316ServiceRecoveryTests.cs',
            '.github/workflows/p316-windows-service-recovery.yml',
            'docs/byok-c1-p316-service-recovery-boundary.md')
          $expected = @($inputs | ForEach-Object { if ($_ -cin @(
            'src/Nayeon.ByokC1.Service/CustodyService.cs',
            'src/Nayeon.ByokC1.Service/Nayeon.ByokC1.Service.csproj')) { "M`t$_" } else { "A`t$_" } })
          $delta = @(git diff --no-renames --name-status $base $head)
          if ($LASTEXITCODE -ne 0 -or $delta.Count -ne 6 -or
              (Compare-Object ($expected | Sort-Object) ($delta | Sort-Object) -CaseSensitive)) { throw 'Exact six-path scope HOLD' }
          $frozen = @(git ls-tree -r --name-only $base -- src/Nayeon.ByokC1.Service tests/p304_product_service tests/p307_service_denial tests/p312_product_vault tests/p313_product_admission tests/p314_durable_intent tests/p315_crossprocess .github/workflows/p312-windows-hosted-disposable-vault.yml .github/workflows/p313-windows-owned-vault-admission.yml .github/workflows/p314-windows-durable-intent.yml .github/workflows/p315-windows-crash-recovery.yml)
          if ($LASTEXITCODE -ne 0 -or $frozen.Count -lt 12) { throw 'Witness inventory HOLD' }
          $frozen = @($frozen | Where-Object { $_ -cnotin $inputs })
          git diff --exit-code $base $head -- $frozen
          if ($LASTEXITCODE -ne 0) { throw 'Frozen service/P312/P313 witness changed' }
          # Actual startup and project changes must be the two exact minimal insertions.
          $startupPath = 'src/Nayeon.ByokC1.Service/CustodyService.cs'
          $oldStartup = (git show "${base}:$startupPath") -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'Startup witness missing' }
          $expectedStartup = $oldStartup.Replace('                    coordinator.BeginStart();',
            '                    ServiceRecoveryBoundary.RequireDenialOnlyStart(VerifyExecutingIdentity);' + "`n" + '                    coordinator.BeginStart();')
          if ($expectedStartup -ceq $oldStartup -or $expectedStartup -cne [IO.File]::ReadAllText($startupPath).Replace("`r`n", "`n").TrimEnd("`n")) { throw 'Startup drift HOLD' }
          $projectPath = 'src/Nayeon.ByokC1.Service/Nayeon.ByokC1.Service.csproj'
          $oldProject = (git show "${base}:$projectPath") -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'Project witness missing' }
          $expectedProject = $oldProject.Replace('    <Compile Include="LifecycleCoordinator.cs" />',
            '    <Compile Include="LifecycleCoordinator.cs" />' + "`n" + '    <Compile Include="ServiceRecoveryBoundary.cs" />')
          if ($expectedProject -ceq $oldProject -or $expectedProject -cne [IO.File]::ReadAllText($projectPath).Replace("`r`n", "`n").TrimEnd("`n")) { throw 'Project drift HOLD' }
          # Parse every PowerShell run block, rather than accepting unparsed workflow text.
          $workflow = [IO.File]::ReadAllText((Join-Path $root '.github/workflows/p316-windows-service-recovery.yml'))
          $blocks = [regex]::Matches($workflow, '(?m)^        run: \|\r?\n(?:(?:          .*|)\r?\n?)+')
          if ($blocks.Count -ne 2) { throw 'Workflow block count HOLD' }
          foreach ($block in $blocks) {
            $body = (($block.Value -split "\r?\n" | Select-Object -Skip 1) | ForEach-Object { $_ -replace '^          ', '' }) -join "`n"
            $tokens = $null; $errors = $null
            $null = [Management.Automation.Language.Parser]::ParseInput($body, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw 'Workflow PowerShell AST HOLD' }
          }
          $witnesses = @($inputs + $frozen | Sort-Object -Unique)
          foreach ($path in $witnesses) {
            $entry = @(git ls-tree $head -- $path)
            if ($LASTEXITCODE -ne 0 -or $entry.Count -ne 1 -or $entry[0] -cnotmatch '\A100644 blob [0-9a-f]{40}\t') { throw 'Git regular file HOLD' }
            $full = [IO.Path]::GetFullPath((Join-Path $root $path))
            for ($current = $full; $current -cne $root; $current = [IO.Path]::GetDirectoryName($current)) {
              if (!$current.StartsWith($root + '\', [StringComparison]::OrdinalIgnoreCase)) { throw 'Witness outside checkout' }
              if ((Get-Item -LiteralPath $current -Force).Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Witness reparse HOLD' }
            }
            if ((Get-Item -LiteralPath $full -Force).PSIsContainer) { throw 'Witness directory HOLD' }
          }
          git diff --check $base $head
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace HOLD' }
          function Assert-Clean {
            $now = git rev-parse HEAD
            if ($LASTEXITCODE -ne 0 -or $now -cne $head) { throw 'HEAD changed' }
            $status = @(git status --porcelain=v1 --untracked-files=all)
            if ($LASTEXITCODE -ne 0 -or $status.Count -ne 0) { throw 'Dirty checkout HOLD' }
          }
          Assert-Clean
          $before = @($witnesses | ForEach-Object { (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash })
          for ($i = 0; $i -lt $witnesses.Count; $i++) { Write-Output "SOURCE_WITNESS_SHA256=$($before[$i]) PATH=$($witnesses[$i])" }
          function Invoke-Bounded([string]$program, [string[]]$arguments, [int]$deadline) {
            $start = [Diagnostics.ProcessStartInfo]::new()
            $start.FileName = $program
            $start.UseShellExecute = $false
            $start.CreateNoWindow = $true
            $start.WorkingDirectory = $root
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            foreach ($argument in $arguments) { $start.ArgumentList.Add($argument) }
            $process = $null
            $captures = @()
            $watch = [Diagnostics.Stopwatch]::StartNew()
            try {
              $process = [Diagnostics.Process]::Start($start)
              foreach ($source in @($process.StandardOutput.BaseStream, $process.StandardError.BaseStream)) {
                $capture = @{ Source = $source; Buffer = [byte[]]::new(1024); Bytes = [IO.MemoryStream]::new(); Pending = $null }
                $capture.Pending = $source.ReadAsync($capture.Buffer, 0, 1024)
                $captures += $capture
              }
              while ($true) {
                if ($watch.ElapsedMilliseconds -gt $deadline) { throw 'Process watchdog expired; cleanup unproven; HOLD' }
                foreach ($capture in $captures) {
                  if ($null -ne $capture.Pending -and $capture.Pending.IsCompleted) {
                    $n = $capture.Pending.GetAwaiter().GetResult()
                    $capture.Pending = $null
                    if ($n -gt 0) {
                      if ($capture.Bytes.Length + $n -gt 8192) { throw 'Bounded output exceeded; HOLD' }
                      $capture.Bytes.Write($capture.Buffer, 0, $n)
                      $capture.Pending = $capture.Source.ReadAsync($capture.Buffer, 0, 1024)
                    }
                  }
                }
                if ($process.HasExited -and @($captures | Where-Object { $null -ne $_.Pending }).Count -eq 0) { break }
                Start-Sleep -Milliseconds 20
              }
              if ($process.ExitCode -ne 0) { throw 'Build/test process failed; cleanup must be reviewed; HOLD' }
              $stdout = [Text.Encoding]::UTF8.GetString($captures[0].Bytes.ToArray())
              if ($captures[1].Bytes.Length -ne 0) { throw 'Unexpected stderr; HOLD' }
              return $stdout
            } finally {
              if ($null -ne $process) {
                try {
                  if (!$process.HasExited) { $process.Kill($true); if (!$process.WaitForExit(5000)) { throw 'Process cleanup incomplete; HOLD' } }
                } finally {
                  foreach ($capture in $captures) { $capture.Source.Dispose(); $capture.Bytes.Dispose() }
                  $process.Dispose()
                }
              }
            }
          }
          try {
            $out = Join-Path $env:RUNNER_TEMP ('p316-' + [Guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Path $out | Out-Null
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
            $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
            if ($LASTEXITCODE -ne 0 -or !$msbuild) { throw 'Installed MSBuild required; no downloads' }
            Write-Output 'P316_STAGE=MSBUILD_START'
            $null = Invoke-Bounded $msbuild @('src/Nayeon.ByokC1.Service/Nayeon.ByokC1.Service.csproj',
              '/nologo', '/verbosity:minimal', '/t:Build', '/warnaserror', '/p:TreatWarningsAsErrors=true',
              "/p:Platform=$env:BUILD_ARCH", "/p:Configuration=$env:BUILD_CONFIGURATION",
              "/p:OutputPath=$out\", "/p:IntermediateOutputPath=$out\obj\") 90000
            Write-Output 'P316_STAGE=MSBUILD_PASS'
            $framework = if ($env:BUILD_ARCH -ceq 'x64') { 'Framework64' } else { 'Framework' }
            $csc = Join-Path $env:WINDIR "Microsoft.NET/$framework/v4.0.30319/csc.exe"
            if (!(Test-Path -LiteralPath $csc -PathType Leaf)) { throw 'Installed compiler required' }
            $product = Join-Path $out 'Nayeon.ByokC1.Service.exe'
            $test = Join-Path $out 'P316.ServiceRecovery.Tests.exe'
            $debugArg = if ($env:BUILD_CONFIGURATION -ceq 'Debug') { '/debug:full' } else { '/debug:pdbonly' }
            $optArg = if ($env:BUILD_CONFIGURATION -ceq 'Debug') { '/optimize-' } else { '/optimize+' }
            $defineArg = if ($env:BUILD_CONFIGURATION -ceq 'Debug') { '/define:DEBUG;TRACE' } else { '/define:TRACE' }
            Write-Output 'P316_STAGE=CSC_P316_START'
            $null = Invoke-Bounded $csc @('/nologo', '/noconfig', '/warn:4', '/warnaserror+', '/target:exe',
              $debugArg, $optArg, $defineArg,
              "/platform:$env:BUILD_ARCH", "/out:$test", "/reference:$product", '/reference:System.dll',
              '/reference:System.Core.dll', '/reference:System.ServiceProcess.dll', '/reference:System.Web.Extensions.dll',
              '/reference:System.Xml.dll', '/reference:System.Security.dll', (Resolve-Path -LiteralPath 'tests/p316_service_recovery/P316ServiceRecoveryTests.cs').ProviderPath) 90000
            Write-Output 'P316_STAGE=CSC_P316_PASS'
            if ((Test-Path Env:P312_SYNTHETIC_HOSTED_ONLY) -or (Test-Path Env:P313_SYNTHETIC_HOSTED_ONLY) -or (Test-Path Env:P314_SYNTHETIC_HOSTED_ONLY) -or (Test-Path Env:P315_SYNTHETIC_HOSTED_ONLY) -or (Test-Path Env:P316_SYNTHETIC_HOSTED_ONLY)) { throw 'Historical effect flags forbidden' }
            $historical = Join-Path $out 'P312.ProductVault.Tests.exe'
            Write-Output 'P316_STAGE=CSC_P312_START'
            $null = Invoke-Bounded $csc @('/nologo', '/noconfig', '/warn:4', '/warnaserror+', '/target:exe',
              $debugArg, $optArg, $defineArg,
              "/platform:$env:BUILD_ARCH", "/out:$historical", "/reference:$product", '/reference:System.dll',
              '/reference:System.Core.dll', '/reference:System.ServiceProcess.dll', '/reference:System.Web.Extensions.dll',
              '/reference:System.Xml.dll', (Resolve-Path -LiteralPath 'tests/p312_product_vault/P312ProductVaultTests.cs').ProviderPath) 90000
            Write-Output 'P316_STAGE=CSC_P312_PASS'
            $historicalHash = (Get-FileHash -LiteralPath $historical -Algorithm SHA256).Hash
            Write-Output 'P316_STAGE=P312_READONLY_START'
            $historicalResult = Invoke-Bounded $historical @('--readonly') 90000
            Write-Output 'P316_STAGE=P312_READONLY_PASS'
            if ($historicalResult -cnotmatch '\AP312 PRODUCT VAULT TESTS PASS count=[1-9][0-9]*\r?\n\z') { throw 'Frozen P312 readonly failed' }
            Write-Output $historicalResult.TrimEnd()
            Write-Output "P312_READONLY_SHA256=$historicalHash"
            $productHash = (Get-FileHash -LiteralPath $product -Algorithm SHA256).Hash
            $testHash = (Get-FileHash -LiteralPath $test -Algorithm SHA256).Hash
            Write-Output "ARCH=$env:BUILD_ARCH CONFIGURATION=$env:BUILD_CONFIGURATION PRODUCT_SHA256=$productHash TEST_SHA256=$testHash"
            # Only this friend EXE executes; never product Main, SCM or a service install.
            Write-Output 'P316_STAGE=P316_READONLY_START'
            $result = Invoke-Bounded $test @() 90000
            Write-Output 'P316_STAGE=P316_READONLY_PASS'
            if ($result -cnotmatch '\AP316 SERVICE RECOVERY TESTS PASS cleanup=verified\r?\n\z') { throw 'Unexpected test output; HOLD' }
            Write-Output $result.TrimEnd()
            if ((Get-FileHash -LiteralPath $historical -Algorithm SHA256).Hash -cne $historicalHash -or
                (Get-FileHash -LiteralPath $product -Algorithm SHA256).Hash -cne $productHash -or
                (Get-FileHash -LiteralPath $test -Algorithm SHA256).Hash -cne $testHash) { throw 'Binary changed' }
          } finally {
            $after = @($witnesses | ForEach-Object { (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash })
            if (($before -join ',') -cne ($after -join ',')) { throw 'Source/witness hashes changed' }
            for ($i = 0; $i -lt $witnesses.Count; $i++) { Write-Output "POST_SHA256=$($after[$i]) PATH=$($witnesses[$i])" }
            Assert-Clean
          }
          Write-Output 'P316 read-only fixture cleanup verified; approvals 0/7; full regressions 0/3; P96 HIGH; P292 UNKNOWN; PRODUCTION HOLD'
