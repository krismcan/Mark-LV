name: P232 Genuine Windows Verified Local Temp + Original Native Fixtures — Original Regression Repair HOLD
on:
  push:
    branches:
      - byok-c1-p232-genuine-windows-safe-temp-and-native-fixture-integration-20261115
permissions:
  contents: read
jobs:
  original-unmodified-tests:
    name: Verified P139 temp / original P210 P213 source fixture regression shard ${{ matrix.shard }}/6
    runs-on: windows-2025
    timeout-minutes: 19
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 5]
    steps:
      - name: Checkout exact signed source without persistent Git credential
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate P232 actual SHA, materialize pristine raw Git Windows source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_OS -ne 'Windows' -or
             $env:GITHUB_EVENT_NAME -ne 'push' -or $env:GITHUB_REPOSITORY -ne 'krismcan/Mark-LV' -or
             $env:GITHUB_REF_NAME -ne 'byok-c1-p232-genuine-windows-safe-temp-and-native-fixture-integration-20261115' -or
             (git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA){
             throw 'P232 actual hosted Windows source event refused'
          }
          if(Test-Path -LiteralPath reviewed){throw 'P232 test clone preexists'}
          git -c core.autocrlf=false clone --quiet --single-branch --branch byok-c1-p232-genuine-windows-safe-temp-and-native-fixture-integration-20261115 https://github.com/krismcan/Mark-LV.git reviewed
          if($LASTEXITCODE -ne 0){throw 'P232 exact source clone failed'}
          git -C reviewed config --local core.autocrlf false
          if((git -C reviewed rev-parse HEAD).Trim() -ne $env:GITHUB_SHA -or
             @(git -C reviewed status --porcelain=v1 -uall).Count -ne 0){
             throw 'P232 original Git raw bytes / source head refused'
          }
          Write-Output 'P232_REAL_WINDOWS_ORIGINAL_GIT_SOURCE=VERIFIED'
      - name: Native Windows CPython 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile only original unsigned test fixtures and run all unchanged assigned unittest cases
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
          P134_NATIVE_WINCRED_EPHEMERAL_AUTH: 'EPHEMERAL_GITHUB_WINDOWS_ONLY'
        run: |
          $ErrorActionPreference='Stop'
          $index='${{ matrix.shard }}'
          $out=Join-Path $env:RUNNER_TEMP ('p232-original-Windows-shard-'+$index)
          New-Item -Path $out -ItemType Directory -Force | Out-Null
          Push-Location reviewed
          try {
            & python -B -m scripts.p232_windows_verified_fixture_regression --parent $index *> (Join-Path $out 'P232-actual-native-process.log')
            $code=$LASTEXITCODE
          } finally {Pop-Location}
          ('P232_EVENT_SHA='+$env:GITHUB_SHA) | Set-Content (Join-Path $out 'P232-native-process-exit.log')
          ('P232_SHARD_INDEX='+$index) | Add-Content (Join-Path $out 'P232-native-process-exit.log')
          ('P232_DIAGNOSTIC_NATIVE_EXIT='+$code) | Add-Content (Join-Path $out 'P232-native-process-exit.log')
          Get-Content -LiteralPath (Join-Path $out 'P232-actual-native-process.log') | ForEach-Object {Write-Output $_}
          if($code -ne 0){throw 'P232 current Windows original test fixture diagnostic failed, retain source and native logs'}
          Write-Output 'P232_VERIFIED_WIN32_TEMP=PASS|P210_P213_UNSIGNED_FIXTURES=READY_ONLY'
          Write-Output 'P232_ORIGINAL_TEST_FAILS=NOT_WAIVED|CURRENT_FULL_PRODUCT=0/3|REALKEY_NO_GO|PRODUCTION_HOLD'
      - name: Archive complete original native Windows failure evidence, no EXEs or source copies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p232-real-Windows-original-safe-fixture-shard-${{ matrix.shard }}-HOLD
          path: ${{ runner.temp }}/p232-original-Windows-shard-${{ matrix.shard }}/*
          if-no-files-found: warn
          retention-days: 14
