name: P194 Prebound Root Child Leaf Windows FileId Trust Witness — RELEASE HOLD
on:
  push:
    branches:
      - byok-c1-p194-prebound-source-root-ancestor-fileid-20261113
permissions:
  contents: read
  actions: read
jobs:
  p194-prebound-fileid:
    name: P194 Historical Original Win32 and Prebound Source FileId Authentic Evidence
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Genuine Windows Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove exact P193 parent and all original historical source branches
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_OS -ne 'Windows' -or
             $env:GITHUB_EVENT_NAME -ne 'push' -or $env:GITHUB_REPOSITORY -ne 'krismcan/Mark-LV' -or
             $env:GITHUB_REF_NAME -ne 'byok-c1-p194-prebound-source-root-ancestor-fileid-20261113'){
             throw 'P194 requires genuine source-matched Windows branch push'
          }
          git -c core.autocrlf=false clone --quiet --single-branch --branch byok-c1-p194-prebound-source-root-ancestor-fileid-20261113 https://github.com/krismcan/Mark-LV.git reviewed
          if($LASTEXITCODE -ne 0){throw 'P194 source clone failed'}
          git -C reviewed config --local core.autocrlf false
          if((git -C reviewed rev-parse HEAD).Trim() -ne $env:GITHUB_SHA){throw 'P194 wrong current source SHA'}
          $parent='ce605cd301f979e735963278c47c09b239b715ce'
          if((git -C reviewed merge-base $parent HEAD).Trim() -ne $parent){throw 'P194 exact P193 ancestor mismatch'}
          $expected=@(
            '.github/workflows/p194-windows-prebound-source-fileid.yml'
            'docs/byok-c1-p194-prebound-root-ancestor-source-identity-review.md'
            'scripts/p194_windows_prebound_source_fileid_authority.py'
          ) | Sort-Object
          $actual=@(git -C reviewed diff --name-only $parent HEAD | Sort-Object)
          if(@(Compare-Object -ReferenceObject $expected -DifferenceObject $actual).Count -ne 0){
             throw 'P194 only three isolated additive audit files'
          }
          git -C reviewed diff --check $parent HEAD
          if($LASTEXITCODE -ne 0){throw 'P194 source audit diff invalid'}
          $old=@(
            @('byok-c1-p189-full-b-physical-alias-verdict-20261113','reviewed_p189','75a312cce7e0231b41b2920c45c3c002bd59f120'),
            @('byok-c1-p190-ntfs-handle-bound-source-inspection-20261113','reviewed_p190','8a94be2670610048416cf6832831a14073a635f5'),
            @('byok-c1-p191-concurrent-source-handle-ads-race-witness-20261113','reviewed_p191','6c759056b380626991e86e2543fac855da8fc5c9'),
            @('byok-c1-p192-stable-parent-handle-identity-ads-race-20261113','reviewed_p192','3541db02537c1b0ec1c7b3b0be4fb925b0271588'),
            @('byok-c1-p193-nt-relative-source-root-admission-20261113','reviewed_p193','ce605cd301f979e735963278c47c09b239b715ce')
          )
          foreach($part in $old){
             git -c core.autocrlf=false clone --quiet --single-branch --branch $part[0] https://github.com/krismcan/Mark-LV.git $part[1]
             if($LASTEXITCODE -ne 0){throw 'P194 original source clone failed'}
             git -C $part[1] config --local core.autocrlf false
             if((git -C $part[1] rev-parse HEAD).Trim() -ne $part[2]){
                throw 'P194 original exact source identity mismatch'
             }
          }
          Write-Output 'P194_ONLY_THREE_AUDIT_FILES_AND_EXACT_P193_PARENT=VERIFIED'
          Write-Output 'P194_AUTHENTIC_P189_P190_P191_P192_P193_NATIVE_SOURCE_CLONES=VERIFIED'
      - name: Authenticate original P193 evidence and run native Win32 prebound source cases
        shell: pwsh
        env:
          P194_ARCHIVE_TOKEN: ${{ github.token }}
          P194_EXACT_P189_ROOT: ${{ github.workspace }}/reviewed_p189
          P194_EXACT_P190_ROOT: ${{ github.workspace }}/reviewed_p190
          P194_EXACT_P191_ROOT: ${{ github.workspace }}/reviewed_p191
          P194_EXACT_P192_ROOT: ${{ github.workspace }}/reviewed_p192
          P194_EXACT_P193_ROOT: ${{ github.workspace }}/reviewed_p193
        run: |
          $ErrorActionPreference='Stop'
          Push-Location reviewed
          try {
             python -B -m scripts.p194_windows_prebound_source_fileid_authority
             if($LASTEXITCODE -ne 0){
                throw 'P194 genuine original-source Windows FileId security test failure — production HOLD'
             }
             Write-Output 'P194_ROOT_ANCESTOR_LEAF_PREBOUND=TEST_FIXTURE_ONLY'
             Write-Output 'P194_DURABLE_SIGNED_ORIGINAL_ROOT_TRUST=NOT_ESTABLISHED'
             Write-Output 'P194_ORIGINAL_HISTORICAL_B_ADS_GAP=UNPATCHED'
             Write-Output 'P194_QUALIFIED_EXTERNAL_SECURITY_REVIEW=OPEN'
             Write-Output 'P194_COMPLETE_UNFILTERED_NATIVE_WINDOWS_REGRESSIONS=0/3'
             Write-Output 'P194_BYOK_C1_PRODUCTION_RELEASE=HOLD'
          } finally {Pop-Location}
      - name: Archive genuine Windows original source-specific logs and H C R including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p194-authentic-Windows-prebound-root-ancestor-source-FileId-NOT-release
          path: |
            ${{ runner.temp }}/nayeon-p194-prebound-windows-fileid/*.log
            ${{ runner.temp }}/nayeon-p194-prebound-windows-fileid/*.json
          if-no-files-found: warn
          retention-days: 14
