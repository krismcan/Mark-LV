name: P99 Complete Original P49 CSharp Native Service DENIAL Link (x64 Only; HOLD)

on:
  push:
    branches:
      - byok-c1-p99-full-native-denial-link-20261107

permissions:
  contents: read

jobs:
  actual-native-all-source-denial:
    name: Full 11 original native CSharp files / Windows x64 / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Exact source parent, additive paths, 11 original P49 native CSharp byte hashes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git -c core.autocrlf=false clone --quiet --single-branch --branch byok-c1-p99-full-native-denial-link-20261107 https://github.com/krismcan/Mark-LV.git reviewed
          if ($LASTEXITCODE -ne 0) { throw 'P99 independent clone failed' }
          git -C reviewed config --local core.autocrlf false
          $head=(git -C reviewed rev-parse HEAD).Trim()
          $parent=(git -C reviewed rev-list --parents -n 1 HEAD).Trim()
          if ($head -ne $env:GITHUB_SHA) { throw 'P99 triggered SHA mismatch' }
          if ($parent -ne ($head + ' 7123e2d0ad57d8a8f1ee8d86a70f411a4fa22467')) { throw 'P99 parent not exact P98' }
          $pins=@{
            'CustodyJournalFile.cs'='483CB220068FE34E28C7D1C58DBC4B6546E9226FC1899B62FAFEE912B6EBF939'
            'CustodyLedger.cs'='93A5EEEC6EE6CC4F6FFF5146B5709F57CBDD37559D62DE0BD4691BF678D5CE0B'
            'CustodyRegistryAnchor.cs'='AB17A58C9558F0AC05AE7602093FA8338CEDCC91A85DB736A871FDEBF17F7C71'
            'CustodyService.cs'='49217E9018AB2437D3F2B4B2907C08946432352618EDEE065F734D88B93EC093'
            'PendingCustodyTransaction.cs'='D8B8E4C6D5EA5E035B58C6AD73DD758C16640167C804CCF3305969B12BDF81AB'
            'PendingServiceState.cs'='B194EE6809BEB84502D9CF509D44237E1A2C24D3905F3764DC4DCA425BAB793E'
            'PendingWinCredStore.cs'='4051A48F3062A737D0D9CE212DB9B302C2C22D5ECA2893CE27B35C740A72B93C'
            'ProtectedAcl.cs'='7152A0DB081EE9627B0F8E4D0D0230168FBF194752F3180DC884C694199AEC61'
            'RecoveryReader.cs'='AF2A0BA2F680DAE0A2ACAA4EF626838A20C23001F76799372D9444EE4D50A650'
            'ServiceCustodyMutex.cs'='2C1BD0DFA679D7C97CF124A0F6612E0DA8EE533EADCF29515E233C5EA214F7BE'
            'ServiceGate.cs'='F65EF9F04283B6CA82D42B8D61B6B99B23262DE62E248DC575C0CEF1B3D96B8D'
          }
          $sourceRoot='reviewed/tests/p99_original_native_c1_denial'
          foreach ($item in $pins.GetEnumerator()) {
            $file=Join-Path $sourceRoot $item.Key
            $sha=(Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash
            if ($sha -ne $item.Value) { throw ("Original CSharp file SHA drift: "+$item.Key) }
          }
          $expected=@('.github/workflows/p99-full-original-native-denial.yml',
                      'docs/byok-c1-p99-full-native-denial-link.md',
                      'tests/p99_original_native_c1_denial/FullOriginalNativeDenialTests.cs')
          foreach ($name in $pins.Keys) {
            $expected += ('tests/p99_original_native_c1_denial/'+$name)
          }
          $expected=@($expected | Sort-Object)
          $actual=@(git -C reviewed diff-tree --no-commit-id --name-only -r HEAD | Sort-Object)
          if (@(Compare-Object -ReferenceObject $expected -DifferenceObject $actual).Count -ne 0) { throw 'P99 files outside approved review scope' }
          if ($expected.Count -ne 14) { throw 'P99 review scope count must be 14' }
          git -C reviewed diff --check HEAD^ HEAD
          if ($LASTEXITCODE -ne 0) { throw 'P99 whitespace error' }
          if (@(git -C reviewed status --porcelain=v1 --untracked-files=all).Count -ne 0) { throw 'P99 checkout dirty' }
          Write-Output "P99_VERIFIED_HEAD=$head"
          Write-Output 'P99_ALL_11_ORIGINAL_NATIVE_P49_SHA256=EXACT'
          Write-Output 'P99_ALL_SOURCE_DELTA=14_ADDITIVE_REVIEW_ONLY'
      - name: Compile and run all 11 real P49 CSharp units with denial test MAIN (never SCM)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $csc='C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $dir=(Resolve-Path -LiteralPath 'reviewed/tests/p99_original_native_c1_denial').Path
          $sources=@(Get-ChildItem -LiteralPath $dir -File -Filter '*.cs' | ForEach-Object { $_.FullName })
          if ($sources.Count -ne 12) { throw 'Expected 11 actual native CSharp + 1 test source' }
          $exe=Join-Path $env:RUNNER_TEMP 'P99_OriginalNativeFullSourceGuard_x64.exe'
          $compilerText=(& $csc /nologo /target:exe /platform:x64 /r:System.ServiceProcess.dll /main:P99FullOriginalNativeDenialTests "/out:$exe" $sources 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $exe)) { throw 'Full native source did not compile' }
          if (-not [String]::IsNullOrWhiteSpace($compilerText)) { throw 'Native source emitted unexpected compiler diagnostics' }
          Write-Output 'P99_ALL_11_NATIVE_CSHARP_SOURCE_COMPILER_EXIT=0'
          for($i=1;$i -le 5;$i++) {
            $result=(& $exe 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0 -or
                $result -notmatch 'P99_ORIGINAL_NATIVE_11_SOURCE_LINK=TRUE' -or
                $result -notmatch 'P99_ORIGINAL_NATIVE_DENIAL_TESTS_PASSED=20' -or
                $result -notmatch 'P99_ORIGINAL_NATIVE_DENIAL_TESTS_FAILED=0' -or
                $result -notmatch 'P99_P49_SERVICE_HOST_STILL_DISABLED=TRUE' -or
                $result -notmatch 'P99_P49_SERVICE_STATE_LEGACY_EFFECT_DISABLED=TRUE' -or
                $result -notmatch 'P99_P49_WINCRED_MUTATION_DISABLED=TRUE' -or
                $result -notmatch 'P99_C1_PRODUCTION_RELEASE=HOLD') {
              throw 'Native source refusal test failed'
            }
          }
          Write-Output 'P99_FULL_NATIVE_DENIAL_REPEATS=5'
          Write-Output 'P99_FULL_NATIVE_DENIAL_CASE_EXECUTIONS=100'
          Write-Output 'P99_REAL_WINCRED_P_INVOKES_NOT_EXECUTED_BY_HARNESS=TRUE'
          Write-Output 'P99_ACTUAL_SERVICE_NOT_INSTALLED_OR_STARTED=TRUE'
          Write-Output 'P99_NATIVE_TEST_EXIT=0'
      - name: Preserve P96 original negative proof and P97 separate corrective fake-only test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $csc='C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $ledger=(Resolve-Path -LiteralPath 'reviewed/tests/p95_native_custody_preflight/CustodyLedger.cs').Path
          $old=(Resolve-Path -LiteralPath 'reviewed/tests/p96_native_transaction_negative/PendingCustodyTransaction.cs').Path
          $negative=(Resolve-Path -LiteralPath 'reviewed/tests/p96_native_transaction_negative/NativeTransactionRaceProof.cs').Path
          $corrected=(Resolve-Path -LiteralPath 'reviewed/tests/p97_disabled_admission_remedy/DisabledNativeAdmissionCoordinator.cs').Path
          $cases=(Resolve-Path -LiteralPath 'reviewed/tests/p97_disabled_admission_remedy/DisabledAdmissionRaceTests.cs').Path
          $exeOld=Join-Path $env:RUNNER_TEMP 'P99_OriginalP96Negative_x64.exe'
          & $csc /nologo /target:exe /platform:x64 "/out:$exeOld" $ledger $old $negative
          if ($LASTEXITCODE -ne 0) { throw 'P96 negative comparator build failed' }
          $resultOld=(& $exeOld 2>&1|Out-String)
          if ($LASTEXITCODE -ne 0 -or $resultOld -notmatch 'P96_NATIVE_ACTUAL_COORDINATOR_TESTS_PASSED=15' -or
              $resultOld -notmatch 'P96_LEGACY_POST_CHECK_REVOCATION_RACE=REPRODUCED_IN_FAKE_ONLY') {
            throw 'Historical actual-source design flaw not preserved'
          }
          $exeNew=Join-Path $env:RUNNER_TEMP 'P99_P97CorrectedOnly_x64.exe'
          & $csc /nologo /target:exe /platform:x64 "/out:$exeNew" $ledger $corrected $cases
          if ($LASTEXITCODE -ne 0) { throw 'P97 corrective model compilation failed' }
          $resultNew=(& $exeNew 2>&1|Out-String)
          if ($LASTEXITCODE -ne 0 -or $resultNew -notmatch 'P97_DISABLED_NATIVE_RACE_TESTS_PASSED=40' -or
              $resultNew -notmatch 'P97_IN_PROCESS_TEST_REMEDY=SERIALIZES_FAKE_DISPATCH_AND_REVOCATION') {
            throw 'P97 separate corrected fake ordering did not pass'
          }
          Write-Output 'P99_P96_ORIGINAL_SECURITY_FINDING=OPEN_REPRODUCED_15_PASS'
          Write-Output 'P99_P97_DISABLED_CORRECTIVE_MODEL=40_PASS'
      - name: Existing affected Python Windows regressions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location reviewed
          try {
            python -B -m unittest -q tests.test_p93_disposable_crash_recovery tests.test_pending_credential_recovery_document tests.test_p91_disabled_admission_model tests.test_p88_pending_observation_lifecycle tests.test_p87_readonly_custody_observation tests.test_p86_live_pending_status_integration tests.test_pending_custody_status_view tests.test_first_run_connection_application tests.test_first_run_connection_window tests.test_first_run_connection_effect_isolation tests.test_phase_830_workspace tests.test_phase_831_workspace tests.test_first_run_connection_cancelled_effect
            if ($LASTEXITCODE -ne 0) { throw 'Affected Python suite failed' }
            Write-Output 'P99_AFFECTED_WINDOWS_PYTHON_NATIVE_EXIT=0'
          } finally { Pop-Location }
      - name: No production installation, x86 policy rerun, key, effect, service or release
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ((git -C reviewed rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'P99 HEAD drift' }
          if (@(git -C reviewed status --porcelain=v1 --untracked-files=all).Count -ne 0) { throw 'P99 checkout dirty' }
          Write-Output 'P99_LINKED_WINCRED_P_INVOKE_SOURCE=NEVER_CALLED'
          Write-Output 'P99_X86_CODE_INTEGRITY_POLICY=HOLD_NO_X86_RUN'
          Write-Output 'P99_REAL_CONSENT_TO_EFFECT_RACE=OPEN_NOT_FIXED'
          Write-Output 'P99_EXTERNAL_QUALIFIED_SECURITY_REVIEW=NOT_RECEIVED'
          Write-Output 'P99_FULL_PRODUCT_REGRESSIONS=NOT_PERFORMED'
          Write-Output 'P99_BYOK_C1_PRODUCTION_RELEASE=HOLD'
