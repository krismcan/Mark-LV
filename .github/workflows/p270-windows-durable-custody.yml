name: P270 disposable durable witness (production HOLD)
on:
  pull_request:
    branches: [byok-c1-p269-service-owned-p96-composition-20261118]
permissions:
  contents: read
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
jobs:
  durable:
    runs-on: windows-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            bits: 64
            framework: Framework64
          - arch: x86
            bits: 32
            framework: Framework
    defaults:
      run:
        shell: pwsh
    env:
      REVIEW_ARCH: ${{ matrix.arch }}
      REVIEW_BITS: ${{ matrix.bits }}
      REVIEW_FRAMEWORK: ${{ matrix.framework }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 4
          persist-credentials: false
      - name: Exact parent five additions and frozen source
        env:
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
          REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
          REVIEW_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP ('p270-evidence-' + $env:REVIEW_ARCH)
          New-Item -ItemType Directory -Path $evidence | Out-Null
          $parent = 'b160244c26dda096e86ec03ca0bd23b10ed29679'
          $first = '815dda613602ec47ec1e5c539ab31d795b2329ee'
          $second = '17cd9774045aaee5ddf97e6c6f3ba89985516fed'
          if ((git rev-parse HEAD).Trim() -cne $env:REVIEW_HEAD -or
              (git rev-parse 'HEAD^').Trim() -cne $second -or
              (git rev-parse 'HEAD^^').Trim() -cne $first -or
              (git rev-parse 'HEAD^^^').Trim() -cne $parent -or $env:REVIEW_BASE -cne $parent -or
              $env:REVIEW_BRANCH -cne 'byok-c1-p270-durable-protected-custody-20261118' -or
              ((git rev-list --parents -n 1 HEAD) -split ' ').Count -ne 2) { throw 'Exact P270 remediation ancestry required' }
          $expected = @('native_c1_successor/P270DevelopmentDurableWitness.cs',
            'tests/p270_successor/P270DurableWitnessTests.cs', 'tests/test_byok_c1_p270_durable_witness.py',
            '.github/workflows/p270-windows-durable-custody.yml', 'docs/byok-c1-p270-durable-custody.md')
          $paths = @(git diff --name-only $parent HEAD)
          $changes = @(git diff --name-status --no-renames $parent HEAD)
          if ($LASTEXITCODE -ne 0 -or $changes.Count -ne 5 -or
              @($changes | Where-Object { $_ -cnotmatch '^A\t' }).Count -ne 0 -or
              @(Compare-Object ($expected | Sort-Object) ($paths | Sort-Object)).Count -ne 0 -or
              @(git status --porcelain=v1 --untracked-files=all).Count -ne 0) { throw 'Exact clean five-addition source required' }
          $frozen = @{
            'tests/p95_native_custody_preflight/CustodyLedger.cs' = '93A5EEEC6EE6CC4F6FFF5146B5709F57CBDD37559D62DE0BD4691BF678D5CE0B'
            'tests/p96_native_transaction_negative/PendingCustodyTransaction.cs' = 'D8B8E4C6D5EA5E035B58C6AD73DD758C16640167C804CCF3305969B12BDF81AB'
            'native_c1_successor/P269ComposedDevelopmentService.cs' = 'CF4550D3BCC14E0A88EE4F2D6AF2082EB666FDAE19D6567B9A133FC48A39A0D7'
            '.github/workflows/p269-windows-service-p96-composition.yml' = '81EA9BFC0FC3B829579EDA605CE65EE903C134F7404F4268622D4A7CD8E30B75'
          }
          foreach ($entry in $frozen.GetEnumerator()) {
            if ((Get-FileHash -LiteralPath $entry.Key -Algorithm SHA256).Hash -cne $entry.Value) { throw 'Frozen source mismatch' }
          }
          foreach ($path in ($expected + @($frozen.Keys))) {
            Write-Output ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash + ' ' + $path)
          }
          Set-Content -LiteralPath (Join-Path $evidence 'scope.log') -Value @('P270_PARENT=' + $parent, 'PRODUCTION=HOLD REAL_KEYS=NO_GO')
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - name: Focused Python source and mutation checks
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $evidence = Join-Path $env:RUNNER_TEMP ('p270-evidence-' + $env:REVIEW_ARCH)
          $log = Join-Path $evidence 'python.log'
          & python -I -B -m unittest discover -s tests -p test_byok_c1_p270_durable_witness.py -v *> $log
          $code = $LASTEXITCODE
          Set-Content -LiteralPath (Join-Path $evidence 'python.exit') -Value $code
          Get-Content -LiteralPath $log
          if ($null -eq $code -or $code -ne 0 -or (Get-Content -Raw $log) -notmatch '(?m)^Ran 5 tests in ') { throw 'Python HOLD' }
      - name: Warning-as-error native build and compiler negative guards
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $evidence = Join-Path $env:RUNNER_TEMP ('p270-evidence-' + $env:REVIEW_ARCH)
          $build = Join-Path $env:RUNNER_TEMP ('p270-build-' + $env:REVIEW_ARCH)
          New-Item -ItemType Directory -Path $build | Out-Null
          $framework = Join-Path $env:WINDIR ('Microsoft.NET/' + $env:REVIEW_FRAMEWORK + '/v4.0.30319')
          $csc = Join-Path $framework 'csc.exe'
          $inputs = @('tests/p95_native_custody_preflight/CustodyLedger.cs',
            'native_c1_successor/P270DevelopmentDurableWitness.cs',
            'tests/p270_successor/P270DurableWitnessTests.cs') | ForEach-Object { (Resolve-Path -LiteralPath $_).Path }
          $common = @('/nologo', '/noconfig', '/target:exe', '/main:P270DurableWitnessTests',
            '/warn:4', '/warnaserror+', '/debug+', '/optimize-', ('/platform:' + $env:REVIEW_ARCH),
            ('/reference:' + (Join-Path $framework 'System.dll')),
            ('/reference:' + (Join-Path $framework 'System.Core.dll')),
            ('/reference:' + (Join-Path $framework 'System.Security.dll')))
          foreach ($missing in @('ALL', 'DEBUG', 'C1_P270_DEVELOPMENT_ONLY')) {
            $flags = @(@('DEBUG', 'C1_P270_DEVELOPMENT_ONLY') | Where-Object { $missing -ne 'ALL' -and $_ -ne $missing })
            $define = @(); if ($flags.Count) { $define = @('/define:' + ($flags -join ';')) }
            $out = Join-Path $build ('guard-' + $missing + '.exe')
            $log = Join-Path $evidence ('guard-' + $missing + '.log')
            & $csc @common @define ('/out:' + $out) @inputs *> $log
            $code = $LASTEXITCODE
            Set-Content -LiteralPath (Join-Path $evidence ('guard-' + $missing + '.exit')) -Value $code
            $diagnostic = if ($missing -eq 'C1_P270_DEVELOPMENT_ONLY') { 'P270_DEVELOPMENT_OPT_IN_REQUIRED' } else { 'P270_NO_RELEASE_BUILD' }
            if ($null -eq $code -or $code -eq 0 -or (Test-Path -LiteralPath $out) -or
                (Get-Content -Raw $log) -notmatch ('error CS1029:.*' + $diagnostic)) { throw 'Compiler guard HOLD' }
          }
          $log = Join-Path $evidence 'compile.log'
          & $csc @common '/define:DEBUG;C1_P270_DEVELOPMENT_ONLY' ('/out:' + (Join-Path $build 'P270.exe')) @inputs *> $log
          $code = $LASTEXITCODE
          Set-Content -LiteralPath (Join-Path $evidence 'compile.exit') -Value $code
          Get-Content -LiteralPath $log
          if ($null -eq $code -or $code -ne 0) { throw 'Native compile HOLD' }
      - name: Actual DPAPI disposable hosted execution with 40 second watchdog
        env:
          P270_HOSTED_DISPOSABLE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted') { throw 'Ephemeral hosted identity required' }
          $evidence = Join-Path $env:RUNNER_TEMP ('p270-evidence-' + $env:REVIEW_ARCH)
          $build = Join-Path $env:RUNNER_TEMP ('p270-build-' + $env:REVIEW_ARCH)
          $stdout = Join-Path $evidence 'runtime.log'
          $stderr = Join-Path $evidence 'stderr.log'
          $watch = [Diagnostics.Stopwatch]::StartNew()
          try {
            $process = Start-Process -FilePath (Join-Path $build 'P270.exe') -WindowStyle Hidden -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          } catch { throw 'Launch denied HOLD: no retry or policy bypass' }
          $null = $process.Handle
          $timedOut = -not $process.WaitForExit([Math]::Max(0, 40000 - [int]$watch.ElapsedMilliseconds))
          if ($timedOut) { Stop-Process -Id $process.Id; $null = $process.WaitForExit(5000) }
          $code = $process.ExitCode
          Set-Content -LiteralPath (Join-Path $evidence 'runtime.exit') -Value $code
          Get-Content -LiteralPath $stdout
          Get-Content -LiteralPath $stderr
          if ($timedOut -or $null -eq $code -or $code -ne 0 -or (Get-Item -LiteralPath $stderr).Length -ne 0) { throw 'Native runtime HOLD' }
          $receipt = Get-Content -Raw $stdout
          if ($receipt -notmatch ('(?m)^P270_DURABLE=PASS CASES=23 ASSERTIONS=[1-9][0-9]* BITS=' + $env:REVIEW_BITS + '\r?$') -or
              $receipt -notmatch '(?m)^P270_SCOPE=DEVELOPMENT_ONLY SYNTHETIC_ONLY PRODUCTION=HOLD\r?$') { throw 'Missing exact runtime receipt' }
      - name: Text evidence hashes and source preservation
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP ('p270-evidence-' + $env:REVIEW_ARCH)
          if (Test-Path -LiteralPath $evidence) {
            foreach ($file in (Get-ChildItem -LiteralPath $evidence -File | Sort-Object Name)) {
              Write-Output ('EVIDENCE ' + $file.Name + ' SHA256=' + (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash)
              Get-Content -LiteralPath $file.FullName
            }
          }
          if (@(git status --porcelain=v1 --untracked-files=all).Count -ne 0) { throw 'Source modified during verification' }
          # No binaries or DPAPI blobs are uploaded. Text evidence is retained in job logs.
