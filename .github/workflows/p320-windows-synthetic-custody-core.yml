name: P320 draft compile and synthetic custody core
on:
  pull_request:
    types: [opened, synchronize, reopened, converted_to_draft]
    branches: [byok-c1-p319-offline-recovery-host-20261124]
    paths:
      - 'src/Nayeon.ByokC1.Service/Nayeon.ByokC1.Service.csproj'
      - 'src/Nayeon.ByokC1.Service/CustodyTransactionCore.cs'
      - 'tests/p320_transaction_core/P320TransactionCoreTests.cs'
      - 'tests/p320_transaction_core/P320.Synthetic.csproj'
      - '.github/workflows/p320-windows-synthetic-custody-core.yml'
      - 'docs/byok-c1-p320-synthetic-custody-core.md'
permissions:
  contents: read
jobs:
  compile-and-synthetic:
    if: github.event.pull_request.draft == true && github.repository == 'krismcan/Mark-LV' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository && github.head_ref == 'byok-c1-p320-durable-custody-core-20261124' && github.base_ref == 'byok-c1-p319-offline-recovery-host-20261124' && github.event.pull_request.base.sha == '9679f4b4609f2c83ea61324ba88f023477ea564c'
    runs-on: windows-2022
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
        configuration: [Debug, Release]
    env:
      BUILD_ARCH: ${{ matrix.arch }}
      BUILD_CONFIGURATION: ${{ matrix.configuration }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Require exact hosted same-repository draft context
        run: |
          $ErrorActionPreference = 'Stop'
          $eventData = Get-Content -Raw -LiteralPath $env:GITHUB_EVENT_PATH | ConvertFrom-Json
          $p = $eventData.pull_request
          if ($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_OS -cne 'Windows' -or
              $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:GITHUB_EVENT_NAME -cne 'pull_request' -or
              $env:GITHUB_REPOSITORY -cne 'krismcan/Mark-LV' -or
              $eventData.repository.full_name -cne $env:GITHUB_REPOSITORY -or
              $eventData.repository.id -ne 1402212689 -or
              $p.head.repo.full_name -cne $env:GITHUB_REPOSITORY -or $p.base.repo.full_name -cne $env:GITHUB_REPOSITORY -or
              $p.head.repo.id -ne $eventData.repository.id -or $p.base.repo.id -ne $eventData.repository.id -or
              ($p.draft -isnot [bool]) -or $p.draft -cne $true -or
              $env:GITHUB_HEAD_REF -cne 'byok-c1-p320-durable-custody-core-20261124' -or
              $env:GITHUB_BASE_REF -cne 'byok-c1-p319-offline-recovery-host-20261124' -or
              $p.head.ref -cne $env:GITHUB_HEAD_REF -or $p.base.ref -cne $env:GITHUB_BASE_REF -or
              $p.base.sha -cne '9679f4b4609f2c83ea61324ba88f023477ea564c' -or
              $p.head.sha -cnotmatch '\A[0-9a-f]{40}\z' -or $p.head.sha -ceq $p.base.sha) {
            throw 'P320 exact draft context HOLD'
          }
          if ($env:BUILD_ARCH -cnotin @('x64', 'x86') -or
              $env:BUILD_CONFIGURATION -cnotin @('Debug', 'Release')) { throw 'P320 matrix HOLD' }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Admit six paths, compile service without running it, run synthetic assembly only
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-Location).Path
          $p = (Get-Content -Raw -LiteralPath $env:GITHUB_EVENT_PATH | ConvertFrom-Json).pull_request
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -cne $p.head.sha) { throw 'Input HEAD HOLD' }
          git merge-base --is-ancestor $p.base.sha $head
          if ($LASTEXITCODE -ne 0) { throw 'P319 ancestry HOLD' }
          $scope = @{
            'src/Nayeon.ByokC1.Service/Nayeon.ByokC1.Service.csproj' = 'M'
            'src/Nayeon.ByokC1.Service/CustodyTransactionCore.cs' = 'A'
            'tests/p320_transaction_core/P320TransactionCoreTests.cs' = 'A'
            'tests/p320_transaction_core/P320.Synthetic.csproj' = 'A'
            '.github/workflows/p320-windows-synthetic-custody-core.yml' = 'A'
            'docs/byok-c1-p320-synthetic-custody-core.md' = 'A'
          }
          $expected = @($scope.Keys | ForEach-Object { $scope[$_] + "`t" + $_ })
          $actual = @(git diff --name-status --no-renames $p.base.sha $head)
          if ($LASTEXITCODE -ne 0 -or $actual.Count -ne 6 -or
              (Compare-Object -CaseSensitive ($expected | Sort-Object) ($actual | Sort-Object))) {
            throw 'P320 one modification / five additions HOLD'
          }
          git diff --check $p.base.sha $head
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace HOLD' }
          function Assert-Clean {
            $now = git rev-parse HEAD
            if ($LASTEXITCODE -ne 0 -or $now -cne $head) { throw 'HEAD changed HOLD' }
            $status = @(git status --porcelain=v1 --untracked-files=all --ignored)
            if ($LASTEXITCODE -ne 0 -or $status.Count -ne 0) { throw 'Index/worktree HOLD' }
          }
          Assert-Clean
          $productProject = 'src/Nayeon.ByokC1.Service/Nayeon.ByokC1.Service.csproj'
          $syntheticProject = 'tests/p320_transaction_core/P320.Synthetic.csproj'
          # Only the exclusion comment may differ in the actual service project.
          $parentProjectLines = @(git show ($p.base.sha + ':' + $productProject))
          if ($LASTEXITCODE -ne 0) { throw 'P319 project witness HOLD' }
          $candidateProject = Get-Content -Raw -LiteralPath $productProject
          # Git checkout may use CRLF; compare text after newline normalization only.
          $withoutComment = ($candidateProject -replace "`r`n", "`n").Replace(
            "    <!-- P320 core/codec/fixtures compile only in tests/p320_transaction_core;`n         keep the production denial-only Compile set identical to P319. -->`n", '')
          if ($withoutComment.TrimEnd("`n") -cne ($parentProjectLines -join "`n").TrimEnd("`n")) {
            throw 'Production project must retain exact P319 build semantics HOLD'
          }
          [xml]$productXml = $candidateProject
          [xml]$syntheticXml = Get-Content -Raw -LiteralPath $syntheticProject
          $productSources = @('CustodyService.cs', 'LifecycleCoordinator.cs', 'ServiceRecoveryBoundary.cs',
            'StatusPipeServer.cs', 'StatusPipeClient.cs', 'SyntheticTransactionOwner.cs', 'SyntheticIngressServer.cs',
            'HostedDisposableWinCred.cs', 'HostedDisposableWinCred.P313Admission.cs', 'DurableIntentJournal.cs')
          $syntheticSources = @('P320TransactionCoreTests.cs',
            '..\..\src\Nayeon.ByokC1.Service\CustodyTransactionCore.cs',
            '..\..\src\Nayeon.ByokC1.Service\SyntheticTransactionOwner.cs',
            '..\p95_native_custody_preflight\CustodyLedger.cs')
          foreach ($pair in @(@{ Xml = $productXml; Expected = $productSources },
              @{ Xml = $syntheticXml; Expected = $syntheticSources })) {
            $includes = @($pair.Xml.Project.ItemGroup.Compile | ForEach-Object { $_.Include })
            if ($includes.Count -ne $pair.Expected.Count -or
                (Compare-Object -CaseSensitive ($includes | Sort-Object) ($pair.Expected | Sort-Object))) {
              throw 'Compilation boundary HOLD'
            }
          }
          $inputs = @($scope.Keys) + @($productSources | ForEach-Object { 'src/Nayeon.ByokC1.Service/' + $_ }) +
            @('tests/p95_native_custody_preflight/CustodyLedger.cs', 'AGENTS.md', 'docs/engineering_failure_review_gate.md')
          $inputs = @($inputs | Sort-Object -Unique)
          foreach ($inputPath in $inputs) {
            $tree = @(git ls-tree $head -- $inputPath)
            if ($LASTEXITCODE -ne 0 -or $tree.Count -ne 1 -or
                $tree[0] -cnotmatch '\A100644 blob [0-9a-f]{40}\t') { throw 'Nonregular source HOLD' }
          }
          $before = @($inputs | ForEach-Object { (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash })
          Write-Output "BASE_SHA=$($p.base.sha) INPUT_HEAD_SHA=$head ARCH=$env:BUILD_ARCH CONFIGURATION=$env:BUILD_CONFIGURATION"
          for ($i = 0; $i -lt $inputs.Count; $i++) { Write-Output "INPUT_SHA256=$($before[$i]) PATH=$($inputs[$i])" }
          # Inherited P309 bounded process/drain pattern; logs live only in RUNNER_TEMP.
          function Invoke-Bounded([string]$program, [string[]]$arguments, [int]$deadline) {
            $start = [Diagnostics.ProcessStartInfo]::new()
            $start.FileName = $program
            $start.UseShellExecute = $false
            $start.CreateNoWindow = $true
            $start.WorkingDirectory = $root
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            foreach ($argument in $arguments) { $start.ArgumentList.Add($argument) }
            $limit = 24 * 1024
            $captures = @()
            $process = $null
            $elapsed = [Diagnostics.Stopwatch]::StartNew()
            try {
              foreach ($name in @('STDOUT', 'STDERR')) {
                $path = Join-Path $env:RUNNER_TEMP ("p320-{0}-{1}.log" -f [Guid]::NewGuid().ToString('N'), $name)
                $file = [IO.File]::Open($path, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::Read)
                $captures += @{ Name = $name; Path = $path; File = $file; Buffer = [byte[]]::new(4096);
                  Saved = 0; Truncated = $false; Source = $null; Pending = $null }
              }
              $process = [Diagnostics.Process]::Start($start)
              $captures[0].Source = $process.StandardOutput.BaseStream
              $captures[1].Source = $process.StandardError.BaseStream
              foreach ($capture in $captures) {
                $capture.Pending = $capture.Source.ReadAsync($capture.Buffer, 0, $capture.Buffer.Length)
              }
              $timedOut = $false
              $drain = $null
              while ($true) {
                foreach ($capture in $captures) {
                  if ($null -ne $capture.Pending -and $capture.Pending.IsCompleted) {
                    $count = $capture.Pending.GetAwaiter().GetResult()
                    $capture.Pending = $null
                    if ($count -gt 0) {
                      $keep = [Math]::Min($count, $limit - $capture.Saved)
                      if ($keep -gt 0) { $capture.File.Write($capture.Buffer, 0, $keep); $capture.Saved += $keep }
                      if ($keep -lt $count) { $capture.Truncated = $true }
                      $capture.Pending = $capture.Source.ReadAsync($capture.Buffer, 0, $capture.Buffer.Length)
                    }
                  }
                }
                if (!$process.HasExited -and $elapsed.ElapsedMilliseconds -ge $deadline) {
                  $timedOut = $true
                  $process.Kill($true)
                  if (!$process.WaitForExit(5000)) { throw 'Process cleanup incomplete; HOLD' }
                }
                if ($process.HasExited) {
                  if ($null -eq $captures[0].Pending -and $null -eq $captures[1].Pending) { break }
                  if ($null -eq $drain) { $drain = [Diagnostics.Stopwatch]::StartNew() }
                  if ($drain.ElapsedMilliseconds -ge 5000) { throw 'Process output cleanup incomplete; HOLD' }
                  [Threading.Thread]::Sleep(10)
                } else { [void]$process.WaitForExit(10) }
              }
              Write-Output "PROGRAM=$program EXIT=$($process.ExitCode) ELAPSED_MS=$($elapsed.ElapsedMilliseconds) ARCH=$env:BUILD_ARCH CONFIGURATION=$env:BUILD_CONFIGURATION"
              if ($timedOut) { throw 'Process deadline exceeded; HOLD' }
              if ($process.ExitCode -ne 0) { throw 'Build/test failed; HOLD' }
              if (@($captures | Where-Object { $_.Truncated }).Count -ne 0) { throw 'Diagnostic cap exceeded; HOLD' }
            } finally {
              try {
                if ($null -ne $process -and !$process.HasExited) {
                  $process.Kill($true)
                  if (!$process.WaitForExit(5000)) { throw 'Process cleanup incomplete; HOLD' }
                }
              } finally {
                try {
                  foreach ($capture in $captures) {
                    $capture.File.Dispose()
                    $diagnostic = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($capture.Path))
                    $diagnostic = $diagnostic -replace '[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]', '?' -replace '::', ': :'
                    Write-Output "PROGRAM=$program STREAM=$($capture.Name) BYTES=$($capture.Saved) TRUNCATED=$($capture.Truncated)"
                    foreach ($line in ($diagnostic -split '\r\n|\n|\r')) { Write-Output "[$($capture.Name)] $line" }
                  }
                } finally {
                  foreach ($capture in $captures) {
                    if ($null -ne $capture.Source) { $capture.Source.Dispose() }
                    $capture.File.Dispose()
                    Remove-Item -LiteralPath $capture.Path -Force -ErrorAction Stop
                  }
                  if ($null -ne $process) { $process.Dispose() }
                }
              }
            }
          }
          try {
            $out = Join-Path $env:RUNNER_TEMP ("p320-{0}-{1}-{2}" -f $env:BUILD_ARCH,
              $env:BUILD_CONFIGURATION, [Guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Path $out -ErrorAction Stop | Out-Null
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
            if (!(Test-Path -LiteralPath $vswhere -PathType Leaf)) { throw 'Installed vswhere required; no downloads' }
            $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
            if ($LASTEXITCODE -ne 0 -or !$msbuild) { throw 'Installed MSBuild required; no downloads' }
            Write-Output "INSTALLED_MSBUILD=$msbuild"
            foreach ($build in @(@{ Project = $productProject; Folder = 'service' },
                @{ Project = $syntheticProject; Folder = 'synthetic' })) {
              $buildOut = Join-Path $out $build.Folder
              Invoke-Bounded $msbuild @($build.Project, '/nologo', '/verbosity:minimal', '/t:Build',
                '/warnaserror', '/p:TreatWarningsAsErrors=true', '/nodeReuse:false',
                "/p:Configuration=$env:BUILD_CONFIGURATION", "/p:Platform=$env:BUILD_ARCH",
                "/p:OutputPath=$buildOut\", "/p:IntermediateOutputPath=$buildOut\obj\") 90000
            }
            $service = Join-Path $out 'service/Nayeon.ByokC1.Service.exe'
            $synthetic = Join-Path $out 'synthetic/P320.TransactionCore.Tests.exe'
            $serviceHash = (Get-FileHash -LiteralPath $service -Algorithm SHA256).Hash
            $syntheticHash = (Get-FileHash -LiteralPath $synthetic -Algorithm SHA256).Hash
            Write-Output "COMPILE_ONLY_SERVICE_SHA256=$serviceHash SYNTHETIC_EXE_SHA256=$syntheticHash"
            # No product reference, service entrypoint, SCM, IPC, journal files or native test.
            # The sole executable under test contains four explicitly selected memory-only sources.
            Invoke-Bounded $synthetic @() 60000
            if ((Get-FileHash -LiteralPath $service -Algorithm SHA256).Hash -cne $serviceHash -or
                (Get-FileHash -LiteralPath $synthetic -Algorithm SHA256).Hash -cne $syntheticHash) {
              throw 'Build artifacts changed HOLD'
            }
          } finally {
            $after = @($inputs | ForEach-Object { (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash })
            if (($before -join ',') -cne ($after -join ',')) { throw 'Input source changed HOLD' }
            Assert-Clean
          }
          Write-Output 'P320 DRAFT SYNTHETIC ONLY; AUTHORED CASES 102 PER SHAPE; P96 HIGH OPEN; P292 UNKNOWN; FIVE HISTORICAL SCOPE CONFLICTS; FULL REGRESSIONS 0/3; REAL-KEY NO-GO; PRODUCTION/RELEASE HOLD'
