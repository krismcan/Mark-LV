name: P286 draft async pipe lifetime review (production HOLD)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [byok-c1-p285-durable-hosted-test-boundary-20261119]
permissions:
  contents: read
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
jobs:
  disposable-durable:
    if: >-
      github.event.pull_request.draft == true &&
      github.repository == 'krismcan/Mark-LV' &&
      github.event.pull_request.base.repo.full_name == 'krismcan/Mark-LV' &&
      github.event.pull_request.head.repo.full_name == 'krismcan/Mark-LV' &&
      github.event.pull_request.base.sha == '52ff1f041afc06a48c41c92aac8ef404d71cc0cb' &&
      github.event.pull_request.base.ref == 'byok-c1-p285-durable-hosted-test-boundary-20261119' &&
      github.event.pull_request.head.ref == 'byok-c1-p286-async-pipe-handle-lifetime-20261119'
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2, 3]
        arch: [x64, x86]
        include:
          - arch: x64
            framework: Framework64
          - arch: x86
            framework: Framework
    defaults:
      run:
        shell: pwsh
    env:
      REVIEW_ARCH: ${{ matrix.arch }}
      REVIEW_FRAMEWORK: ${{ matrix.framework }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Verify custody, compile guards, run disposable host, verify no drift
        run: ./tests/p286_async_pipe/HostedReview.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p286-async-pipe-${{ matrix.arch }}-trial-${{ matrix.trial }}
          path: |
            ${{ runner.temp }}/p285-evidence-${{ matrix.arch }}/focused.exit
            ${{ runner.temp }}/p285-evidence-${{ matrix.arch }}/focused.log
            ${{ runner.temp }}/p285-evidence-${{ matrix.arch }}/source-before.sha256
            ${{ runner.temp }}/p285-evidence-${{ matrix.arch }}/source-after.sha256
            ${{ runner.temp }}/p285-evidence-${{ matrix.arch }}/compiler.log
            ${{ runner.temp }}/p285-evidence-${{ matrix.arch }}/compiler-exits.txt
            ${{ runner.temp }}/p285-evidence-${{ matrix.arch }}/durable-binary.sha256
            ${{ runner.temp }}/p285-evidence-${{ matrix.arch }}/runtime.stdout.log
            ${{ runner.temp }}/p285-evidence-${{ matrix.arch }}/runtime.stderr.log
            ${{ runner.temp }}/p285-evidence-${{ matrix.arch }}/runtime.exit
            ${{ runner.temp }}/p285-evidence-${{ matrix.arch }}/host.log
            ${{ runner.temp }}/p285-evidence-${{ matrix.arch }}/host.exit
            ${{ runner.temp }}/p285-evidence-${{ matrix.arch }}/scope.log
          if-no-files-found: error
          retention-days: 30
