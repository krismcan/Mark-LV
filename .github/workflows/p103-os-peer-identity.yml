name: P103 Native Windows read-only OS peer SID observation (x64 HOLD)

on:
  push:
    branches:
      - byok-c1-p103-os-peer-identity-20261107

permissions:
  contents: read

jobs:
  native-windows-x64:
    name: Disposable Windows named pipe OS SID observed, no authority / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Exact P102 child, four path scope and eleven frozen P49 native SHA pins
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git -c core.autocrlf=false clone --quiet --single-branch --branch byok-c1-p103-os-peer-identity-20261107 https://github.com/krismcan/Mark-LV.git reviewed
          if ($LASTEXITCODE -ne 0) { throw 'P103 source clone failed' }
          git -C reviewed config --local core.autocrlf false
          $head=(git -C reviewed rev-parse HEAD).Trim()
          $parents=(git -C reviewed rev-list --parents -n 1 HEAD).Trim()
          if ($head -ne $env:GITHUB_SHA) { throw 'P103 GitHub trigger SHA mismatch' }
          if ($parents -ne ($head+' d0989ea0e814ffe2537cd9f3a168bc744e5af13c')) {
            throw 'P103 does not descend directly from exact P102'
          }
          $expected=@('.github/workflows/p103-os-peer-identity.yml',
                      'docs/byok-c1-p103-windows-peer-observation-review.md',
                      'native_c1_candidate/ReadOnlyWindowsPeerObservation.cs',
                      'tests/p103_os_peer_identity/WindowsReadOnlyPeerObservationTests.cs')|Sort-Object
          $actual=@(git -C reviewed diff-tree --no-commit-id --name-only -r HEAD | Sort-Object)
          if (@(Compare-Object -ReferenceObject $expected -DifferenceObject $actual).Count -ne 0) {
            throw 'Unexpected P103 source scope'
          }
          $pins=@{
            'CustodyJournalFile.cs'='483CB220068FE34E28C7D1C58DBC4B6546E9226FC1899B62FAFEE912B6EBF939'
            'CustodyLedger.cs'='93A5EEEC6EE6CC4F6FFF5146B5709F57CBDD37559D62DE0BD4691BF678D5CE0B'
            'CustodyRegistryAnchor.cs'='AB17A58C9558F0AC05AE7602093FA8338CEDCC91A85DB736A871FDEBF17F7C71'
            'CustodyService.cs'='49217E9018AB2437D3F2B4B2907C08946432352618EDEE065F734D88B93EC093'
            'PendingCustodyTransaction.cs'='D8B8E4C6D5EA5E035B58C6AD73DD758C16640167C804CCF3305969B12BDF81AB'
            'PendingServiceState.cs'='B194EE6809BEB84502D9CF509D44237E1A2C24D3905F3764DC4DCA425BAB793E'
            'PendingWinCredStore.cs'='4051A48F3062A737D0D9CE212DB9B302C2C22D5ECA2893CE27B35C740A72B93C'
            'ProtectedAcl.cs'='7152A0DB081EE9627B0F8E4D0D0230168FBF194752F3180DC884C694199AEC61'
            'RecoveryReader.cs'='AF2A0BA2F680DAE0A2ACAA4EF626838A20C23001F76799372D9444EE4D50A650'
            'ServiceCustodyMutex.cs'='2C1BD0DFA679D7C97CF124A0F6612E0DA8EE533EADCF29515E233C5EA214F7BE'
            'ServiceGate.cs'='F65EF9F04283B6CA82D42B8D61B6B99B23262DE62E248DC575C0CEF1B3D96B8D'
          }
          foreach($p in $pins.GetEnumerator()){
            $path=Join-Path 'reviewed/tests/p99_original_native_c1_denial' $p.Key
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash -ne $p.Value){
              throw ('P103 original P49 SHA drift '+$p.Key)
            }
          }
          git -C reviewed diff --check HEAD^ HEAD
          if ($LASTEXITCODE -ne 0) { throw 'P103 source whitespace invalid' }
          if (@(git -C reviewed status --porcelain=v1 --untracked-files=all).Count -ne 0) {
            throw 'P103 source checkout dirty'
          }
          Write-Output "P103_EXACT_SOURCE_HEAD=$head"
          Write-Output 'P103_AUTHENTIC_ELEVEN_P49_NATIVE_FILES_UNCHANGED=TRUE'
          Write-Output 'P103_REVIEW_ONLY_CHANGED_PATHS=FOUR'
      - name: Compile genuine Windows local SID observer with ten original P49 units and disabled P102 host
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $csc='C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $old=(Resolve-Path -LiteralPath 'reviewed/tests/p99_original_native_c1_denial').Path
          $candidate=(Resolve-Path -LiteralPath 'reviewed/native_c1_candidate').Path
          $original=@(Get-ChildItem -LiteralPath $old -Filter '*.cs' -File |
                     Where-Object { $_.Name -ne 'CustodyService.cs' -and
                                    $_.Name -ne 'FullOriginalNativeDenialTests.cs' } |
                     ForEach-Object { $_.FullName })
          if ($original.Count -ne 10) { throw 'P103 original native unit count changed' }
          $candidateHost=Join-Path $candidate 'CustodyService.cs'
          $fence=Join-Path $candidate 'ServiceOwnedAdmissionBoundary.cs'
          $identity=Join-Path $candidate 'ServiceBoundRequestIdentity.cs'
          $observer=Join-Path $candidate 'ReadOnlyWindowsPeerObservation.cs'
          $cases=(Resolve-Path -LiteralPath 'reviewed/tests/p103_os_peer_identity/WindowsReadOnlyPeerObservationTests.cs').Path
          $source=Get-Content -LiteralPath $observer -Raw
          if ($source -match 'CredWrite\s*\(|CredDelete\s*\(|CredRead\s*\(|DllImport|ServiceBase\.Run\s*\(|RegistryKey|Win32_Service|New-Service|System\.Net\.') {
            throw 'P103 observer contains forbidden privileged credential/service code'
          }
          if ($source -notmatch 'RunAsClient' -or $source -notmatch 'PipeSecurity' -or
              $source -notmatch 'DENIED') { throw 'P103 not the promised Windows OS peer observation' }
          $exe=Join-Path $env:RUNNER_TEMP 'P103_WindowsRealOsPipeObserver_x64.exe'
          $compile=(& $csc /nologo /target:exe /platform:x64 /r:System.ServiceProcess.dll /r:System.Core.dll /r:System.Security.dll /main:P103WindowsReadOnlyPeerObservationTests "/out:$exe" $original $candidateHost $fence $identity $observer $cases 2>&1|Out-String)
          if ($LASTEXITCODE -ne 0 -or -not [String]::IsNullOrWhiteSpace($compile)) {
            throw 'P103 Windows original-native + observer compile failed or warnings'
          }
          Write-Output 'P103_WINDOWS_OS_PIPE_CSHARP_COMPILER_EXIT=0'
          for($i=1;$i -le 5;$i++){
            $result=(& $exe 2>&1|Out-String)
            if ($LASTEXITCODE -ne 0 -or
                $result -notmatch 'P103_REAL_WINDOWS_NAMED_PIPE_NATIVE_CASES_PASSED=16' -or
                $result -notmatch 'P103_REAL_WINDOWS_NAMED_PIPE_NATIVE_CASES_FAILED=0' -or
                $result -notmatch 'P103_OS_PEER_SID_OBSERVED_NOT_USER_CONSENT=TRUE' -or
                $result -notmatch 'P103_WIRE_RESPONSE_DENIED_ONLY=TRUE' -or
                $result -notmatch 'P103_NATIVE_WIN_CRED_EFFECTS=NONE' -or
                $result -notmatch 'P103_C1_PRODUCTION_RELEASE=HOLD') {
              throw 'P103 authentic Windows pipe identity observation/denial test failed'
            }
          }
          Write-Output 'P103_REAL_WINDOWS_PIPE_NATIVE_RUNS=5'
          Write-Output 'P103_REAL_WINDOWS_PIPE_NATIVE_CASE_EXECUTIONS=80'
          Write-Output 'P103_REAL_WINDOWS_PIPE_NATIVE_EXIT=0'
      - name: Run unchanged P102 and P99 original CSharp denial baselines
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $csc='C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $old=(Resolve-Path -LiteralPath 'reviewed/tests/p99_original_native_c1_denial').Path
          $original=@(Get-ChildItem -LiteralPath $old -Filter '*.cs' -File |
                     Where-Object { $_.Name -ne 'CustodyService.cs' -and
                                    $_.Name -ne 'FullOriginalNativeDenialTests.cs' } |
                     ForEach-Object { $_.FullName })
          $candidate=(Resolve-Path -LiteralPath 'reviewed/native_c1_candidate').Path
          $candidateHost=Join-Path $candidate 'CustodyService.cs'
          $fence=Join-Path $candidate 'ServiceOwnedAdmissionBoundary.cs'
          $identity=Join-Path $candidate 'ServiceBoundRequestIdentity.cs'
          $cases=(Resolve-Path -LiteralPath 'reviewed/tests/p102_service_bound_request/ServiceBoundRequestTests.cs').Path
          $exe=Join-Path $env:RUNNER_TEMP 'P103_P102_BoundRequest_x64.exe'
          & $csc /nologo /target:exe /platform:x64 /r:System.ServiceProcess.dll /main:P102ServiceBoundRequestTests "/out:$exe" $original $candidateHost $fence $identity $cases
          if ($LASTEXITCODE -ne 0) { throw 'P102 regression compile failure' }
          $result=(& $exe 2>&1|Out-String)
          if ($LASTEXITCODE -ne 0 -or $result -notmatch 'P102_BOUND_REQUEST_NATIVE_TESTS_PASSED=34' -or
              $result -notmatch 'P102_BOUND_REQUEST_NATIVE_TESTS_FAILED=0') {
            throw 'P102 native request-bound denial regression failed'
          }
          Write-Output 'P103_P102_BOUND_REQUEST_REGRESSION=34_PASS'
          $sources=@(Get-ChildItem -LiteralPath $old -Filter '*.cs' -File | ForEach-Object {$_.FullName})
          $exeOld=Join-Path $env:RUNNER_TEMP 'P103_P99_FullOriginalDenial_x64.exe'
          & $csc /nologo /target:exe /platform:x64 /r:System.ServiceProcess.dll /main:P99FullOriginalNativeDenialTests "/out:$exeOld" $sources
          if ($LASTEXITCODE -ne 0) { throw 'P99 original native baseline compile failure' }
          $out=(& $exeOld 2>&1|Out-String)
          if ($LASTEXITCODE -ne 0 -or $out -notmatch 'P99_ORIGINAL_NATIVE_DENIAL_TESTS_PASSED=20' -or
              $out -notmatch 'P99_ORIGINAL_NATIVE_DENIAL_TESTS_FAILED=0') {
            throw 'P99 original native denial baseline changed'
          }
          Write-Output 'P103_P99_ORIGINAL_NATIVE_DENIAL=20_PASS'
      - name: Existing affected Windows Python test inventory
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location reviewed
          try {
            python -B -m unittest -q tests.test_p93_disposable_crash_recovery tests.test_pending_credential_recovery_document tests.test_p91_disabled_admission_model tests.test_p88_pending_observation_lifecycle tests.test_p87_readonly_custody_observation tests.test_p86_live_pending_status_integration tests.test_pending_custody_status_view tests.test_first_run_connection_application tests.test_first_run_connection_window tests.test_first_run_connection_effect_isolation tests.test_phase_830_workspace tests.test_phase_831_workspace tests.test_first_run_connection_cancelled_effect
            if ($LASTEXITCODE -ne 0) { throw 'P103 affected Python native test exit nonzero' }
            Write-Output 'P103_AFFECTED_WINDOWS_PYTHON_NATIVE_EXIT=0'
          } finally { Pop-Location }
      - name: Retain independent consent, x86 policy and real C1 security holds
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ((git -C reviewed rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'P103 source SHA drift' }
          if (@(git -C reviewed status --porcelain=v1 --untracked-files=all).Count -ne 0) { throw 'P103 checkout dirty' }
          Write-Output 'P103_WINDOWS_OS_SID_OBSERVATION=NOT_TRUSTED_USER_CONSENT'
          Write-Output 'P103_LOCAL_PIPE_LISTENER=DISPOSABLE_TEST_ONLY'
          Write-Output 'P103_REAL_CREDENTIAL_EFFECTS=NONE'
          Write-Output 'P103_QUALIFIED_SECURITY_REVIEW=NOT_RECEIVED'
          Write-Output 'P103_P61_ORIGINAL_NATIVE_RACE=OPEN'
          Write-Output 'P103_X86_KRISTIAN_SIGNING_POLICY=HOLD_NOT_BYPASSED'
          Write-Output 'P103_OPENAI_P62_PLATFORM_RESTRICTION=UNTOUCHED'
          Write-Output 'P103_BYOK_C1_PRODUCTION_RELEASE=HOLD'
