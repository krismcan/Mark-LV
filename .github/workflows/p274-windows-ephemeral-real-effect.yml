name: P274 disposable actual WinCred timing (production HOLD)
on:
  pull_request:
    branches: [byok-c1-p273-current-p76-admission-20261118]
    types: [opened, synchronize, reopened, converted_to_draft]
permissions:
  contents: read
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
jobs:
  ephemeral-effect:
    if: >-
      ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.draft == true &&
          github.repository == 'krismcan/Mark-LV' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.base.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'byok-c1-p274-real-os-effect-gate-20261118' &&
          github.event.pull_request.base.ref == 'byok-c1-p273-current-p76-admission-20261118' &&
          github.event.pull_request.base.sha == '9546228e5c726a46a3bf91ba05793f38c23d686f' }}
    runs-on: windows-2022
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            bits: 64
            framework: Framework64
          - arch: x86
            bits: 32
            framework: Framework
    defaults:
      run:
        shell: pwsh
    env:
      P274_ARCH: ${{ matrix.arch }}
      P274_BITS: ${{ matrix.bits }}
      P274_FRAMEWORK: ${{ matrix.framework }}
      P274_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      P274_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact five additions and frozen parent custody
        run: |
          $ErrorActionPreference = 'Stop'
          $parent = '9546228e5c726a46a3bf91ba05793f38c23d686f'
          $evidence = Join-Path $env:RUNNER_TEMP ('p274-evidence-' + $env:P274_ARCH)
          New-Item -ItemType Directory -Path $evidence | Out-Null
          if ($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_OS -cne 'Windows' -or
              $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:GITHUB_EVENT_NAME -cne 'pull_request' -or
              $env:GITHUB_REPOSITORY -cne 'krismcan/Mark-LV' -or
              $env:GITHUB_HEAD_REF -cne 'byok-c1-p274-real-os-effect-gate-20261118' -or
              $env:GITHUB_BASE_REF -cne 'byok-c1-p273-current-p76-admission-20261118' -or
              $env:P274_BASE_SHA -cne $parent -or $env:P274_HEAD_SHA -cnotmatch '\A[0-9a-f]{40}\z' -or
              (git rev-parse HEAD).Trim() -cne $env:P274_HEAD_SHA -or
              (git rev-parse 'HEAD^').Trim() -cne $parent -or
              ((git rev-list --parents -n 1 HEAD) -split ' ').Count -ne 2) { throw 'Exact hosted one-child PR required' }
          $eventFile = Get-Item -LiteralPath $env:GITHUB_EVENT_PATH
          if ($eventFile.Length -le 0 -or $eventFile.Length -gt 262144) { throw 'Event exceeds bound' }
          $event = Get-Content -LiteralPath $eventFile.FullName -Raw | ConvertFrom-Json
          if ($event.pull_request.draft -ne $true -or
              $event.repository.full_name -cne 'krismcan/Mark-LV' -or
              $event.pull_request.head.repo.full_name -cne 'krismcan/Mark-LV' -or
              $event.pull_request.base.repo.full_name -cne 'krismcan/Mark-LV' -or
              $event.pull_request.head.sha -cne $env:P274_HEAD_SHA -or
              $event.pull_request.base.sha -cne $parent -or
              $event.pull_request.head.ref -cne $env:GITHUB_HEAD_REF -or
              $event.pull_request.base.ref -cne $env:GITHUB_BASE_REF -or
              $env:GITHUB_REF -cne ('refs/pull/' + $event.pull_request.number + '/merge')) { throw 'Wrong actual event JSON' }
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          try {
              if ($null -eq $identity.User -or $identity.User.IsWellKnown([Security.Principal.WellKnownSidType]::LocalSystemSid)) { throw 'LocalSystem forbidden' }
          } finally { $identity.Dispose() }
          $expected = @('native_c1_successor/P274EphemeralWinCredEffect.cs',
              'tests/p274_successor/P274EphemeralWinCredEffectTests.cs',
              'tests/test_byok_c1_p274_ephemeral_effect.py',
              '.github/workflows/p274-windows-ephemeral-real-effect.yml',
              'docs/byok-c1-p274-ephemeral-wincred-effect.md')
          $changes = @(git diff --name-status --no-renames $parent HEAD)
          $paths = @(git diff --name-only --no-renames $parent HEAD)
          if ($LASTEXITCODE -ne 0 -or $changes.Count -ne 5 -or
              @($changes | Where-Object { $_ -cnotmatch '^A\t' }).Count -ne 0 -or
              @(Compare-Object ($expected | Sort-Object) ($paths | Sort-Object)).Count -ne 0) { throw 'Exact five additions required' }
          foreach ($path in $expected) {
              if ((git ls-tree HEAD -- $path) -cnotmatch '^100644 blob [0-9a-f]{40}\t') { throw 'Regular file required' }
          }
          if (@(git status --porcelain=v1 --untracked-files=all).Count -ne 0) { throw 'Dirty checkout' }
          $frozen = @{
              'tests/p95_native_custody_preflight/CustodyLedger.cs' = '93A5EEEC6EE6CC4F6FFF5146B5709F57CBDD37559D62DE0BD4691BF678D5CE0B'
              'tests/p96_native_transaction_negative/PendingCustodyTransaction.cs' = 'D8B8E4C6D5EA5E035B58C6AD73DD758C16640167C804CCF3305969B12BDF81AB'
              'tests/p96_native_transaction_negative/NativeTransactionRaceProof.cs' = '2AEEAA8BA97396216B32D1894C8B8EA3AF7FACE44FB3562FF1C4DDE5E7DC582F'
              'native_c1_successor/P268ServiceOwnedPendingTransaction.cs' = '964AF496E72C5510823809E4EBB74E045D2F01E7F0A9FABE7DBAE4625B172CFC'
              'tests/p268_successor/P268RemediationTests.cs' = 'B2C91CA2D203A5825F65ED969BB4DD5D22CEFA6B2A9717A456404D4112A29C14'
              '.github/workflows/p273-p76-current-admission.yml' = '0AEC883209771BF7DF3213145CC35CAF2C13952B1DBB055AE873D085E1DC78DC'
              'scripts/p273_p76_current_admission.py' = '472684DF6A035C231980D006EE2E954384C0739401BB7A3213868A124251DEEE'
          }
          foreach ($entry in $frozen.GetEnumerator()) {
              if ((Get-FileHash -LiteralPath $entry.Key -Algorithm SHA256).Hash -cne $entry.Value) { throw 'Frozen source mismatch' }
          }
          $hashes = [ordered]@{}
          foreach ($path in ($expected + @($frozen.Keys))) { $hashes[$path] = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash }
          $hashes | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence 'source-hashes.json')
          @('HEAD=' + $env:P274_HEAD_SHA, 'PARENT=' + $parent,
              'DEVELOPMENT_ONLY; ORIGINAL_P96_HOLD; P76_FOUR_FAIL_UNWAIVED; REAL_KEYS_NO_GO; PRODUCT_0/3') |
              Set-Content -LiteralPath (Join-Path $evidence 'scope.log')
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.8'
          architecture: ${{ matrix.arch }}
      - name: Source contracts syntax and causal mutations only
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $evidence = Join-Path $env:RUNNER_TEMP ('p274-evidence-' + $env:P274_ARCH)
          foreach ($module in @('test_byok_c1_p274_ephemeral_effect.py', 'test_byok_c1_p268_p96_remediation.py')) {
              $log = Join-Path $evidence ($module + '.log')
              & python -I -B -m unittest discover -s tests -p $module -v *> $log
              $raw = $LASTEXITCODE
              Set-Content -LiteralPath (Join-Path $evidence ($module + '.exit')) -Value $raw
              Get-Content -LiteralPath $log
              $expected = if ($module -eq 'test_byok_c1_p274_ephemeral_effect.py') { 8 } else { 6 }
              if ($null -eq $raw -or $raw -ne 0 -or (Get-Content -LiteralPath $log -Raw) -notmatch ('(?m)^Ran ' + $expected + ' tests in ')) { throw 'Source suite HOLD' }
          }
      - name: Compile guarded actual P268 and original P96 separately
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $evidence = Join-Path $env:RUNNER_TEMP ('p274-evidence-' + $env:P274_ARCH)
          $build = Join-Path $env:RUNNER_TEMP ('p274-build-' + $env:P274_ARCH)
          New-Item -ItemType Directory -Path $build | Out-Null
          $framework = Join-Path $env:WINDIR ('Microsoft.NET/' + $env:P274_FRAMEWORK + '/v4.0.30319')
          $csc = Join-Path $framework 'csc.exe'
          $common = @('/nologo', '/noconfig', '/debug+', '/optimize-', '/warn:4', '/warnaserror+', '/target:exe',
              ('/platform:' + $env:P274_ARCH), ('/reference:' + (Join-Path $framework 'System.dll')),
              ('/reference:' + (Join-Path $framework 'System.Core.dll')),
              ('/reference:' + (Join-Path $framework 'System.Web.Extensions.dll')))
          $original = @('tests/p95_native_custody_preflight/CustodyLedger.cs',
              'tests/p96_native_transaction_negative/PendingCustodyTransaction.cs',
              'tests/p96_native_transaction_negative/NativeTransactionRaceProof.cs') | ForEach-Object { (Resolve-Path -LiteralPath $_).Path }
          $p268 = @($original) + @('native_c1_successor/P268ServiceOwnedPendingTransaction.cs',
              'tests/p268_successor/P268RemediationTests.cs' | ForEach-Object { (Resolve-Path -LiteralPath $_).Path })
          $p274 = @($p268) + @('native_c1_successor/P274EphemeralWinCredEffect.cs',
              'tests/p274_successor/P274EphemeralWinCredEffectTests.cs' | ForEach-Object { (Resolve-Path -LiteralPath $_).Path })
          $flags = @('DEBUG', 'C1_P268_DEVELOPMENT_ONLY', 'C1_P274_EPHEMERAL_WINCRED_ONLY')
          foreach ($missing in @('ALL') + $flags) {
              $selected = @($flags | Where-Object { $missing -ne 'ALL' -and $_ -ne $missing })
              $define = @(); if ($selected.Count) { $define = @('/define:' + ($selected -join ';')) }
              $out = Join-Path $build ('missing-' + $missing + '.exe')
              $log = Join-Path $evidence ('guard-' + $missing + '.log')
              & $csc @common @define /main:P274EphemeralWinCredEffectTests ('/out:' + $out) @p274 *> $log
              $raw = $LASTEXITCODE
              Set-Content -LiteralPath (Join-Path $evidence ('guard-' + $missing + '.exit')) -Value $raw
              $text = Get-Content -LiteralPath $log -Raw
              $markers = @()
              if ('DEBUG' -notin $selected) { $markers += @('P268_NO_RELEASE_BUILD', 'P268_TESTS_NO_RELEASE_BUILD', 'P274_NO_RELEASE_BUILD', 'P274_TESTS_NO_RELEASE_BUILD') }
              if ('C1_P268_DEVELOPMENT_ONLY' -notin $selected) { $markers += @('P268_DEVELOPMENT_ONLY_EXPLICIT_OPT_IN_REQUIRED', 'P268_TESTS_REQUIRE_DEVELOPMENT_BUILD', 'P274_REQUIRES_P268_DEVELOPMENT_ONLY', 'P274_TESTS_REQUIRE_P268_DEVELOPMENT_ONLY') }
              if ('C1_P274_EPHEMERAL_WINCRED_ONLY' -notin $selected) { $markers += @('P274_EPHEMERAL_OPT_IN_REQUIRED', 'P274_TESTS_EPHEMERAL_OPT_IN_REQUIRED') }
              if ($null -eq $raw -or $raw -eq 0 -or (Test-Path -LiteralPath $out) -or
                  ([regex]::Matches($text, 'error CS1029:')).Count -ne $markers.Count -or
                  ([regex]::Matches($text, 'error CS\d+:')).Count -ne $markers.Count) { throw 'Guard compile did not fail exactly' }
              foreach ($marker in $markers) { if ($text -notmatch ('error CS1029:.*' + $marker)) { throw 'Missing guard marker' } }
          }
          foreach ($kind in @('Original', 'P268', 'P274')) {
              $inputs = $original; $main = 'Nayeon.ByokC1.P96NegativeProof'; $define = @()
              if ($kind -eq 'P268') { $inputs = $p268; $main = 'P268RemediationTests'; $define = @('/define:DEBUG;C1_P268_DEVELOPMENT_ONLY') }
              if ($kind -eq 'P274') { $inputs = $p274; $main = 'P274EphemeralWinCredEffectTests'; $define = @('/define:' + ($flags -join ';')) }
              $log = Join-Path $evidence ($kind + '-compile.log')
              & $csc @common @define ('/main:' + $main) ('/out:' + (Join-Path $build ($kind + '.exe'))) @inputs *> $log
              $raw = $LASTEXITCODE
              Set-Content -LiteralPath (Join-Path $evidence ($kind + '-compile.exit')) -Value $raw
              Get-Content -LiteralPath $log
              if ($null -eq $raw -or $raw -ne 0) { throw 'Compile HOLD' }
          }
      - name: Hosted disposable native runs with explicit safe environment and watchdog
        env:
          P274_NATIVE_AUTH: DISPOSABLE_HOSTED_SYNTHETIC_ONLY
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP ('p274-evidence-' + $env:P274_ARCH)
          $build = Join-Path $env:RUNNER_TEMP ('p274-build-' + $env:P274_ARCH)
          foreach ($kind in @('Original', 'P268', 'P274')) {
              $info = [Diagnostics.ProcessStartInfo]::new()
              $info.FileName = Join-Path $build ($kind + '.exe')
              $info.WorkingDirectory = $env:GITHUB_WORKSPACE
              $info.UseShellExecute = $false; $info.CreateNoWindow = $true
              $info.RedirectStandardOutput = $true; $info.RedirectStandardError = $true
              $info.EnvironmentVariables.Clear()
              foreach ($key in @('SystemRoot', 'WINDIR', 'USERPROFILE', 'APPDATA', 'LOCALAPPDATA', 'TEMP', 'TMP',
                  'RUNNER_TEMP', 'RUNNER_OS', 'RUNNER_ENVIRONMENT', 'GITHUB_ACTIONS', 'GITHUB_REPOSITORY',
                  'GITHUB_EVENT_NAME', 'GITHUB_EVENT_PATH', 'GITHUB_REF', 'GITHUB_HEAD_REF', 'GITHUB_BASE_REF',
                  'P274_HEAD_SHA', 'P274_BASE_SHA', 'P274_NATIVE_AUTH')) {
                  $value = [Environment]::GetEnvironmentVariable($key)
                  if ($null -ne $value) { $info.EnvironmentVariables[$key] = $value }
              }
              $process = [Diagnostics.Process]::new(); $process.StartInfo = $info
              $started = $false
              try {
                  $started = $process.Start()
                  if (-not $started) { throw 'Launch refused' }
                  $stdout = $process.StandardOutput.ReadToEndAsync(); $stderr = $process.StandardError.ReadToEndAsync()
                  $timeout = -not $process.WaitForExit(60000)
                  if ($timeout) { $process.Kill(); if (-not $process.WaitForExit(5000)) { throw 'Watchdog kill incomplete; HOLD' } }
                  $raw = $process.ExitCode
                  Set-Content -LiteralPath (Join-Path $evidence ($kind + '-runtime.exit')) -Value $raw
                  Set-Content -LiteralPath (Join-Path $evidence ($kind + '-watchdog.log')) -Value ('TIMED_OUT=' + $timeout)
                  if (-not $stdout.Wait(5000) -or -not $stderr.Wait(5000)) { throw 'Output deadline HOLD' }
                  $text = $stdout.Result; $errors = $stderr.Result
                  [IO.File]::WriteAllText((Join-Path $evidence ($kind + '-runtime.log')), $text)
                  [IO.File]::WriteAllText((Join-Path $evidence ($kind + '-stderr.log')), $errors)
                  Write-Output $text
                  if ($timeout -or $null -eq $raw -or $raw -ne 0 -or $errors.Length -ne 0) { throw 'Native failure; STOP no retry; disposable profile cleanup not assured' }
                  if ($kind -eq 'Original') {
                      foreach ($receipt in @('P96_NATIVE_ACTUAL_COORDINATOR_TESTS_PASSED=15', 'P96_NATIVE_ACTUAL_COORDINATOR_TESTS_FAILED=0',
                          'P96_LEGACY_POST_CHECK_REVOCATION_RACE=REPRODUCED_IN_FAKE_ONLY', 'P96_REAL_NATIVE_EFFECTS=NONE', 'P96_SECURITY_FINDING=OPEN', 'P96_C1_PRODUCTION_RELEASE=HOLD')) {
                          if ($text -notmatch ('(?m)^' + [regex]::Escape($receipt) + '\r?$')) { throw 'Original negative receipt missing' }
                      }
                  } elseif ($kind -eq 'P268') {
                      if ($text -notmatch ('(?m)^P268_SUCCESSOR=PASS CASES=33 ASSERTIONS=[1-9][0-9]* BITS=' + $env:P274_BITS + '\r?$') -or
                          ([regex]::Matches($text, '(?m)^PASS ')).Count -ne 33) { throw 'Frozen P268 receipt missing' }
                  } else {
                      if ($text -notmatch ('(?m)^P274_EPHEMERAL=PASS CASES=30 ASSERTIONS=[1-9][0-9]* BITS=' + $env:P274_BITS + '\r?$') -or
                          ([regex]::Matches($text, '(?m)^PASS ')).Count -ne 30 -or
                          ([regex]::Matches($text, '(?m)^P274_GATED_NATIVE_READBACK=')).Count -ne 18 -or
                          ([regex]::Matches($text, '(?m)^P274_SETUP_SEED_NOT_TERMINAL=')).Count -ne 18) { throw 'Incomplete OS timing evidence' }
                      $initial = @([regex]::Matches($text, '(?m)^P274_INITIAL_ABSENT=(Nayeon\.P274\.Disposable\.[0-9a-f]{32})\r?$') | ForEach-Object { $_.Groups[1].Value })
                      $cleanup = @([regex]::Matches($text, '(?m)^P274_CLEANUP_ABSENT=(Nayeon\.P274\.Disposable\.[0-9a-f]{32})\r?$') | ForEach-Object { $_.Groups[1].Value })
                      if ($initial.Count -ne 32 -or $cleanup.Count -ne 32 -or @($initial | Sort-Object -Unique).Count -ne 32 -or
                          @(Compare-Object ($initial | Sort-Object) ($cleanup | Sort-Object)).Count -ne 0) { throw 'Target cleanup receipt mismatch' }
                  }
              } catch {
                  Set-Content -LiteralPath (Join-Path $evidence ($kind + '-failure.log')) -Value 'HOLD STOP_NO_RETRY'
                  throw
              } finally {
                  try {
                      if ($started -and -not $process.HasExited) {
                          $process.Kill()
                          if (-not $process.WaitForExit(5000)) { throw 'Process termination incomplete; HOLD' }
                      }
                  } finally { $process.Dispose() }
              }
          }
      - name: Reverify custody and hash text evidence only
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP ('p274-evidence-' + $env:P274_ARCH)
          try {
              $hashes = Get-Content -LiteralPath (Join-Path $evidence 'source-hashes.json') -Raw | ConvertFrom-Json -AsHashtable
              foreach ($entry in $hashes.GetEnumerator()) {
                  if ((Get-FileHash -LiteralPath $entry.Key -Algorithm SHA256).Hash -cne $entry.Value) { throw 'Source changed' }
              }
              git diff --check
              if ($LASTEXITCODE -ne 0 -or @(git status --porcelain=v1 --untracked-files=all).Count -ne 0) { throw 'Checkout changed' }
          } finally {
              Get-ChildItem -LiteralPath $evidence -File | Where-Object { $_.Extension -in @('.log', '.exit', '.json') } |
                  Sort-Object Name | ForEach-Object { $_.Name + ' SHA256=' + (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash } |
                  Set-Content -LiteralPath (Join-Path $evidence 'evidence-sha256.log')
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p274-ephemeral-text-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/p274-evidence-${{ matrix.arch }}/*.log
            ${{ runner.temp }}/p274-evidence-${{ matrix.arch }}/*.exit
            ${{ runner.temp }}/p274-evidence-${{ matrix.arch }}/*.json
          if-no-files-found: error
          retention-days: 30
