name: P271 service-owned durable development bridge (production HOLD)
on:
  pull_request:
    branches: [byok-c1-p270-durable-protected-custody-20261118]
permissions:
  contents: read
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
jobs:
  integration:
    runs-on: windows-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            bits: 64
            framework: Framework64
          - arch: x86
            bits: 32
            framework: Framework
    defaults:
      run:
        shell: pwsh
    env:
      REVIEW_ARCH: ${{ matrix.arch }}
      REVIEW_BITS: ${{ matrix.bits }}
      REVIEW_FRAMEWORK: ${{ matrix.framework }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Exact parent and additive source envelope
        env:
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
          REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
          REVIEW_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          $parent = '1b9c3d56a942930d059065a05b84b127cf671bfb'
          if ((git rev-parse HEAD).Trim() -cne $env:REVIEW_HEAD -or
              (git rev-parse 'HEAD^').Trim() -cne $parent -or $env:REVIEW_BASE -cne $parent -or
              $env:REVIEW_BRANCH -cne 'byok-c1-p271-service-owned-durable-custody-20261118' -or
              ((git rev-list --parents -n 1 HEAD) -split ' ').Count -ne 2) { throw 'Exact P271 parent required' }
          $expected = @('native_c1_successor/P271DurableDevelopmentBridge.cs',
            'tests/p271_successor/P271DurableBridgeTests.cs', 'tests/test_byok_c1_p271_durable_integration.py',
            '.github/workflows/p271-windows-durable-service-integration.yml', 'docs/byok-c1-p271-durable-service-integration.md')
          $paths = @(git diff --name-only $parent HEAD)
          $changes = @(git diff --name-status --no-renames $parent HEAD)
          if ($LASTEXITCODE -ne 0 -or $changes.Count -ne 5 -or
              @($changes | Where-Object { $_ -cnotmatch '^A\t' }).Count -ne 0 -or
              @(Compare-Object ($expected | Sort-Object) ($paths | Sort-Object)).Count -ne 0 -or
              @(git status --porcelain=v1 --untracked-files=all).Count -ne 0) { throw 'Exact clean five additions required' }
          foreach ($path in $expected) { Write-Output ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash + ' ' + $path) }
          $evidence = Join-Path $env:RUNNER_TEMP ('p271-evidence-' + $env:REVIEW_ARCH)
          New-Item -ItemType Directory -Path $evidence | Out-Null
          Set-Content -LiteralPath (Join-Path $evidence 'scope.log') -Value @('P271_PARENT=' + $parent, 'REAL_KEYS=NO_GO PRODUCTION=HOLD')
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - name: Focused source and mutation checks
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $evidence = Join-Path $env:RUNNER_TEMP ('p271-evidence-' + $env:REVIEW_ARCH)
          $log = Join-Path $evidence 'python.log'
          & python -I -B -m unittest discover -s tests -p test_byok_c1_p271_durable_integration.py -v *> $log
          $code = $LASTEXITCODE
          Set-Content -LiteralPath (Join-Path $evidence 'python.exit') -Value $code
          Get-Content -LiteralPath $log
          if ($null -eq $code -or $code -ne 0 -or (Get-Content -Raw $log) -notmatch '(?m)^Ran 5 tests in ') { throw 'Python HOLD' }
      - name: Warning-as-error builds and missing-guard rejection
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $evidence = Join-Path $env:RUNNER_TEMP ('p271-evidence-' + $env:REVIEW_ARCH)
          $build = Join-Path $env:RUNNER_TEMP ('p271-build-' + $env:REVIEW_ARCH)
          New-Item -ItemType Directory -Path $build | Out-Null
          $framework = Join-Path $env:WINDIR ('Microsoft.NET/' + $env:REVIEW_FRAMEWORK + '/v4.0.30319')
          $csc = Join-Path $framework 'csc.exe'
          $inputs = @('tests/p95_native_custody_preflight/CustodyLedger.cs',
            'tests/p96_native_transaction_negative/PendingCustodyTransaction.cs',
            'tests/p96_native_transaction_negative/NativeTransactionRaceProof.cs',
            'native_c1_successor/P265DevelopmentPipeAdapter.cs',
            'native_c1_successor/P267DevelopmentAtomicService.cs',
            'native_c1_successor/P268ServiceOwnedPendingTransaction.cs',
            'native_c1_successor/P269ComposedDevelopmentService.cs',
            'native_c1_successor/P270DevelopmentDurableWitness.cs',
            'native_c1_successor/P271DurableDevelopmentBridge.cs',
            'tests/p271_successor/P271DurableBridgeTests.cs') | ForEach-Object { (Resolve-Path -LiteralPath $_).Path }
          $common = @('/nologo', '/noconfig', '/target:exe', '/main:P271DurableBridgeTests',
            '/warn:4', '/warnaserror+', '/debug+', '/optimize-', ('/platform:' + $env:REVIEW_ARCH),
            ('/reference:' + (Join-Path $framework 'System.dll')),
            ('/reference:' + (Join-Path $framework 'System.Core.dll')),
            ('/reference:' + (Join-Path $framework 'System.Security.dll')),
            ('/reference:' + (Join-Path $framework 'System.ServiceProcess.dll')))
          $flags = @('DEBUG', 'C1_P265_DEVELOPMENT_ONLY', 'C1_P267_DEVELOPMENT_ONLY',
            'C1_P268_DEVELOPMENT_ONLY', 'C1_P269_DEVELOPMENT_ONLY', 'C1_P270_DEVELOPMENT_ONLY', 'C1_P271_DEVELOPMENT_ONLY')
          foreach ($missing in (@('ALL') + $flags)) {
            $selected = @($flags | Where-Object { $missing -ne 'ALL' -and $_ -ne $missing })
            $define = @(); if ($selected.Count) { $define = @('/define:' + ($selected -join ';')) }
            $out = Join-Path $build ('guard-' + $missing + '.exe')
            $log = Join-Path $evidence ('guard-' + $missing + '.log')
            & $csc @common @define ('/out:' + $out) @inputs *> $log
            $code = $LASTEXITCODE
            Set-Content -LiteralPath (Join-Path $evidence ('guard-' + $missing + '.exit')) -Value $code
            if ($null -eq $code -or $code -eq 0 -or (Test-Path -LiteralPath $out) -or
                (Get-Content -Raw $log) -notmatch 'error CS1029:.*(NO_RELEASE_BUILD|DEVELOPMENT.*REQUIRED|OPT_INS_REQUIRED)') { throw 'Compiler guard HOLD' }
          }
          $log = Join-Path $evidence 'compile.log'
          & $csc @common ('/define:' + ($flags -join ';')) ('/out:' + (Join-Path $build 'P271.exe')) @inputs *> $log
          $code = $LASTEXITCODE
          Set-Content -LiteralPath (Join-Path $evidence 'compile.exit') -Value $code
          Get-Content -LiteralPath $log
          if ($null -eq $code -or $code -ne 0) { throw 'Native compile HOLD' }
      - name: Hosted disposable execution only with watchdog
        env:
          P271_HOSTED_DISPOSABLE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted') { throw 'GitHub-hosted only' }
          $evidence = Join-Path $env:RUNNER_TEMP ('p271-evidence-' + $env:REVIEW_ARCH)
          $build = Join-Path $env:RUNNER_TEMP ('p271-build-' + $env:REVIEW_ARCH)
          $stdout = Join-Path $evidence 'runtime.log'
          $stderr = Join-Path $evidence 'stderr.log'
          $watch = [Diagnostics.Stopwatch]::StartNew()
          try {
            $process = Start-Process -FilePath (Join-Path $build 'P271.exe') -WindowStyle Hidden -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          } catch { throw 'Launch denied HOLD: no retry or policy bypass' }
          $null = $process.Handle
          $timedOut = -not $process.WaitForExit([Math]::Max(0, 60000 - [int]$watch.ElapsedMilliseconds))
          if ($timedOut) { Stop-Process -Id $process.Id; $null = $process.WaitForExit(5000) }
          $code = $process.ExitCode
          Set-Content -LiteralPath (Join-Path $evidence 'runtime.exit') -Value $code
          Get-Content -LiteralPath $stdout
          Get-Content -LiteralPath $stderr
          if ($timedOut -or $null -eq $code -or $code -ne 0 -or (Get-Item -LiteralPath $stderr).Length -ne 0) { throw 'Native runtime HOLD' }
          $receipt = Get-Content -Raw $stdout
          if ($receipt -notmatch ('(?m)^P271_INTEGRATION=PASS CASES=38 ASSERTIONS=[1-9][0-9]* BITS=' + $env:REVIEW_BITS + '\r?$') -or
              $receipt -notmatch '(?m)^P271_SCOPE=DEVELOPMENT_ONLY SYNTHETIC_ONLY PRODUCTION=HOLD\r?$') { throw 'Missing runtime receipt' }
      - name: Preserve raw text evidence and source
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP ('p271-evidence-' + $env:REVIEW_ARCH)
          if (Test-Path -LiteralPath $evidence) {
            foreach ($file in (Get-ChildItem -LiteralPath $evidence -File | Sort-Object Name)) {
              Write-Output ('EVIDENCE ' + $file.Name + ' SHA256=' + (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash)
              Get-Content -LiteralPath $file.FullName
            }
          }
          if (@(git status --porcelain=v1 --untracked-files=all).Count -ne 0) { throw 'Source modified during verification' }
          # Text logs only; never upload executables or protected blobs.
