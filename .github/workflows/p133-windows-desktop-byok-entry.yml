      - name: P133 real Windows desktop Tk manual-launch and preserved user BYOK functional acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_OS -ne 'Windows'){
            throw 'P133 Tk acceptance requires hosted Windows, never Kristian'
          }
          Push-Location reviewed
          try{
            python -m compileall -q nayeon/brain/local_byok_user_scope.py nayeon/desktop_alpha/local_byok_window.py nayeon/desktop_alpha/local_byok_launch_bridge.py nayeon/desktop_alpha/application.py nayeon/desktop_alpha/workspace_window.py tests/test_local_user_scope_byok.py tests/test_p133_connection_launch.py tests/test_p133_scope_migration.py
            if($LASTEXITCODE -ne 0){throw 'P133 desktop and local BYOK compileall failed'}
            Write-Output 'P133_WINDOWS_PYTHON_COMPILEALL=PASS'
            # P133: genuine Windows Tk integration, ALL process spawn calls
            # FAKE; plus unchanged P132 36 functional tests, and exact new
            # P133 seven-path authorisation/scope guard.
            python -m unittest -v tests.test_p133_connection_launch tests.test_p133_scope_migration tests.test_local_user_scope_byok.LocalOfflineControllerTests tests.test_local_user_scope_byok.WindowsUserScopeNativeMutexTests tests.test_local_user_scope_byok.WindowsLocalByokRealTkTests
            if($LASTEXITCODE -ne 0){throw 'P133 real Tk desktop launch / P132 local BYOK functional acceptance failed'}
            Write-Output 'P133_REAL_WINDOWS_TK_MANUAL_DESKTOP_ENTRY_WITH_FAKE_POPEN=PASS'
            Write-Output 'P133_P132_EXISTING_LOCAL_USER_SCOPE_FUNCTIONAL_TESTS=PASS'
            # Original P132 migration and historic P76/P8 seals require
            # their EXACT original branches/inventories; preserve their
            # bytes and Git history, never call them green on P133.
            # Run all unchanged applicable older functional classes.
            python -m unittest -v tests.test_windows_credential_backend.BackendTests tests.test_windows_credential_backend.NativeAdapterTests tests.test_first_run_credential_management_window tests.test_credential_operation_host tests.test_bound_credential_lifecycle.LifecycleTests tests.test_first_run_connection_application
            if($LASTEXITCODE -ne 0){throw 'P133 inherited credential or Connection navigation regression failed'}
            Write-Output 'P133_ORIGINAL_CONNECTION_PREVIEW_FUNCTIONAL_REGRESSION=PASS'
            Write-Output 'P133_P132_AND_P76_BRANCH_PINNED_SCOPE_GUARDS=UNCHANGED_NOT_RUN_ON_P133'
