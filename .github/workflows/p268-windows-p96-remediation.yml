name: P268 isolated P96 repair (production HOLD)
on:
  pull_request:
    branches:
      - byok-c1-p267-service-owned-atomic-ordering-20261118
permissions:
  contents: read
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
jobs:
  remediation:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            bits: 64
            framework: Framework64
          - arch: x86
            bits: 32
            framework: Framework
    defaults:
      run:
        shell: pwsh
    env:
      REVIEW_ARCH: ${{ matrix.arch }}
      REVIEW_BITS: ${{ matrix.bits }}
      REVIEW_FRAMEWORK: ${{ matrix.framework }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact branch parent additions and source custody
        env:
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
          REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
          REVIEW_BRANCH: ${{ github.event.pull_request.head.ref }}
          REVIEW_TARGET: ${{ github.event.pull_request.base.ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP ('p268-evidence-' + $env:REVIEW_ARCH)
          New-Item -ItemType Directory -Path $evidence | Out-Null
          $parent = '0241b4277b8098c47e4de725bd1425bf0a0e764e'
          if ((git rev-parse HEAD).Trim() -cne $env:REVIEW_HEAD -or
              $env:REVIEW_BASE -cne $parent -or
              $env:REVIEW_BRANCH -cne 'byok-c1-p268-p96-actual-successor-20261118' -or
              $env:REVIEW_TARGET -cne 'byok-c1-p267-service-owned-atomic-ordering-20261118' -or
              (git rev-parse 'HEAD^').Trim() -cne $parent -or
              ((git rev-list --parents -n 1 HEAD) -split ' ').Count -ne 2) { throw 'Exact one-child topology required' }
          $expected = @('native_c1_successor/P268ServiceOwnedPendingTransaction.cs',
              'tests/p268_successor/P268RemediationTests.cs',
              'tests/test_byok_c1_p268_p96_remediation.py',
              '.github/workflows/p268-windows-p96-remediation.yml',
              'docs/byok-c1-p268-p96-remediation.md')
          $paths = @(git diff --name-only $parent HEAD)
          $changes = @(git diff --name-status --no-renames $parent HEAD)
          if ($LASTEXITCODE -ne 0 -or $changes.Count -ne 5 -or
              @($changes | Where-Object { $_ -cnotmatch '^A\t' }).Count -ne 0 -or
              @(Compare-Object ($expected | Sort-Object) ($paths | Sort-Object)).Count -ne 0) { throw 'Exact five additions required' }
          if (@(git status --porcelain=v1 --untracked-files=all).Count -ne 0) { throw 'Dirty checkout' }
          $frozen = @{
              'tests/p95_native_custody_preflight/CustodyLedger.cs' = '93A5EEEC6EE6CC4F6FFF5146B5709F57CBDD37559D62DE0BD4691BF678D5CE0B'
              'tests/p96_native_transaction_negative/PendingCustodyTransaction.cs' = 'D8B8E4C6D5EA5E035B58C6AD73DD758C16640167C804CCF3305969B12BDF81AB'
              'tests/p96_native_transaction_negative/NativeTransactionRaceProof.cs' = '2AEEAA8BA97396216B32D1894C8B8EA3AF7FACE44FB3562FF1C4DDE5E7DC582F'
          }
          foreach ($entry in $frozen.GetEnumerator()) {
              if ((Get-FileHash -LiteralPath $entry.Key -Algorithm SHA256).Hash -cne $entry.Value) { throw 'Frozen source hash mismatch' }
          }
          $hashes = [ordered]@{}
          foreach ($path in ($expected + @($frozen.Keys) + @(
              'native_c1_successor/P267DevelopmentAtomicService.cs',
              '.github/workflows/p267-windows-atomic-ordering.yml',
              '.github/workflows/p96-native-transaction-negative-proof.yml'))) {
              $hashes[$path] = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
          }
          $hashes | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence 'source-hashes.json')
          Set-Content -LiteralPath (Join-Path $evidence 'scope.log') -Value @(
              ('HEAD=' + $env:REVIEW_HEAD), ('PARENT=' + $parent),
              'P268_SCOPE=ISOLATED_FAKE_ONLY PRODUCTION=HOLD TRUSTED_ISSUER=NOT_CONNECTED')
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - name: Source and red mutation tests
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $evidence = Join-Path $env:RUNNER_TEMP ('p268-evidence-' + $env:REVIEW_ARCH)
          $log = Join-Path $evidence 'source-tests.log'
          & python -I -B -m unittest discover -s tests -p test_byok_c1_p268_p96_remediation.py -v *> $log
          $rawExit = $LASTEXITCODE
          Set-Content -LiteralPath (Join-Path $evidence 'source-tests.exit') -Value $rawExit
          Get-Content -LiteralPath $log
          if ($null -eq $rawExit -or $rawExit -ne 0 -or
              (Get-Content -LiteralPath $log -Raw) -notmatch '(?m)^Ran 6 tests in ') { throw 'Focused source checks failed' }
      - name: Compile original negative separately and guarded successor warning-as-error
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $evidence = Join-Path $env:RUNNER_TEMP ('p268-evidence-' + $env:REVIEW_ARCH)
          $framework = Join-Path $env:WINDIR ('Microsoft.NET/' + $env:REVIEW_FRAMEWORK + '/v4.0.30319')
          $csc = Join-Path $framework 'csc.exe'
          $build = Join-Path $env:RUNNER_TEMP ('p268-build-' + $env:REVIEW_ARCH)
          New-Item -ItemType Directory -Path $build | Out-Null
          $common = @('/nologo', '/noconfig', '/debug+', '/optimize-', '/warn:4', '/warnaserror+',
              '/target:exe', ('/platform:' + $env:REVIEW_ARCH),
              ('/reference:' + (Join-Path $framework 'System.dll')),
              ('/reference:' + (Join-Path $framework 'System.Core.dll')))
          $original = @('tests/p95_native_custody_preflight/CustodyLedger.cs',
              'tests/p96_native_transaction_negative/PendingCustodyTransaction.cs',
              'tests/p96_native_transaction_negative/NativeTransactionRaceProof.cs') | ForEach-Object { (Resolve-Path -LiteralPath $_).Path }
          $successor = @($original) + @('native_c1_successor/P268ServiceOwnedPendingTransaction.cs',
              'tests/p268_successor/P268RemediationTests.cs' | ForEach-Object { (Resolve-Path -LiteralPath $_).Path })
          $flags = @('DEBUG', 'C1_P268_DEVELOPMENT_ONLY')
          foreach ($missing in @('ALL', 'DEBUG', 'C1_P268_DEVELOPMENT_ONLY')) {
              $selected = @($flags | Where-Object { $missing -ne 'ALL' -and $_ -ne $missing })
              $define = @()
              if ($selected.Count) { $define = @('/define:' + ($selected -join ';')) }
              $out = Join-Path $build ('missing-' + $missing + '.exe')
              $log = Join-Path $evidence ('guard-' + $missing + '.log')
              & $csc @common @define /main:P268RemediationTests ('/out:' + $out) @successor *> $log
              $rawExit = $LASTEXITCODE
              Set-Content -LiteralPath (Join-Path $evidence ('guard-' + $missing + '.exit')) -Value $rawExit
              $diagnostics = Get-Content -LiteralPath $log -Raw
              $required = @()
              if ('DEBUG' -notin $selected) { $required += 'P268_NO_RELEASE_BUILD'; $required += 'P268_TESTS_NO_RELEASE_BUILD' }
              if ('C1_P268_DEVELOPMENT_ONLY' -notin $selected) {
                  $required += 'P268_DEVELOPMENT_ONLY_EXPLICIT_OPT_IN_REQUIRED'; $required += 'P268_TESTS_REQUIRE_DEVELOPMENT_BUILD'
              }
              if ($null -eq $rawExit -or $rawExit -eq 0 -or (Test-Path -LiteralPath $out) -or
                  ([regex]::Matches($diagnostics, 'error CS1029:')).Count -ne $required.Count -or
                  ([regex]::Matches($diagnostics, 'error CS\d+:')).Count -ne $required.Count) { throw 'Development guard failed' }
              foreach ($marker in $required) { if ($diagnostics -notmatch ('error CS1029:.*' + $marker)) { throw 'Missing guard diagnostic' } }
          }
          foreach ($kind in @('Original', 'Successor')) {
              $inputs = $original; $main = 'Nayeon.ByokC1.P96NegativeProof'; $define = @()
              if ($kind -eq 'Successor') { $inputs = $successor; $main = 'P268RemediationTests'; $define = @('/define:DEBUG;C1_P268_DEVELOPMENT_ONLY') }
              $log = Join-Path $evidence ($kind + '-compile.log')
              & $csc @common @define ('/main:' + $main) ('/out:' + (Join-Path $build ($kind + '.exe'))) @inputs *> $log
              $rawExit = $LASTEXITCODE
              Set-Content -LiteralPath (Join-Path $evidence ($kind + '-compile.exit')) -Value $rawExit
              Get-Content -LiteralPath $log
              if ($null -eq $rawExit -or $rawExit -ne 0) { throw 'Compile failure' }
          }
      - name: Run frozen expected-vulnerable proof separately then isolated repair
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP ('p268-evidence-' + $env:REVIEW_ARCH)
          $build = Join-Path $env:RUNNER_TEMP ('p268-build-' + $env:REVIEW_ARCH)
          foreach ($kind in @('Original', 'Successor')) {
              $stdout = Join-Path $evidence ($kind + '-runtime.log')
              $stderr = Join-Path $evidence ($kind + '-stderr.log')
              $watch = [Diagnostics.Stopwatch]::StartNew()
              try {
                  $process = Start-Process -FilePath (Join-Path $build ($kind + '.exe')) -WindowStyle Hidden -PassThru -ErrorAction Stop -RedirectStandardOutput $stdout -RedirectStandardError $stderr
              } catch {
                  Set-Content -LiteralPath (Join-Path $evidence ($kind + '-launch.log')) -Value 'BLOCKED STOP_NO_RETRY'
                  throw 'Ordinary launch refused; no bypass'
              }
              $null = $process.Handle
              $remaining = [Math]::Max(0, 40000 - [int]$watch.ElapsedMilliseconds)
              $timedOut = -not $process.WaitForExit($remaining)
              if ($timedOut) { Stop-Process -Id $process.Id -ErrorAction Stop; $null = $process.WaitForExit(5000) }
              $rawExit = $process.ExitCode
              Set-Content -LiteralPath (Join-Path $evidence ($kind + '-runtime.exit')) -Value $rawExit
              Get-Content -LiteralPath $stdout
              Get-Content -LiteralPath $stderr
              if ($timedOut -or $null -eq $rawExit -or $rawExit -ne 0 -or (Get-Item -LiteralPath $stderr).Length -ne 0) { throw 'Native failure; STOP no retry' }
              $text = Get-Content -LiteralPath $stdout -Raw
              if ($kind -eq 'Original') {
                  foreach ($receipt in @('P96_NATIVE_ACTUAL_COORDINATOR_TESTS_PASSED=15',
                      'P96_NATIVE_ACTUAL_COORDINATOR_TESTS_FAILED=0',
                      'P96_LEGACY_POST_CHECK_REVOCATION_RACE=REPRODUCED_IN_FAKE_ONLY',
                      'P96_SECURITY_FINDING=OPEN', 'P96_C1_PRODUCTION_RELEASE=HOLD')) {
                      if ($text -notmatch ('(?m)^' + [regex]::Escape($receipt) + '\r?$')) { throw 'Expected old vulnerability not reproduced' }
                  }
              } else {
                  if ($text -notmatch ('(?m)^P268_SUCCESSOR=PASS CASES=33 ASSERTIONS=[1-9][0-9]* BITS=' + $env:REVIEW_BITS + '\r?$') -or
                      $text -notmatch '(?m)^P268_FIXED_PATH=ISOLATED_FAKE_ONLY PRODUCTION=HOLD TRUSTED_ISSUER=NOT_CONNECTED\r?$' -or
                      ([regex]::Matches($text, '(?m)^PASS ')).Count -ne 33) { throw 'Exact successor receipt absent' }
              }
          }
      - name: Verify unchanged source and record SHA256 of text evidence
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP ('p268-evidence-' + $env:REVIEW_ARCH)
          $hashes = Get-Content -LiteralPath (Join-Path $evidence 'source-hashes.json') -Raw | ConvertFrom-Json -AsHashtable
          foreach ($entry in $hashes.GetEnumerator()) {
              if ((Get-FileHash -LiteralPath $entry.Key -Algorithm SHA256).Hash -cne $entry.Value) { throw 'Source changed' }
          }
          git diff --check
          if ($LASTEXITCODE -ne 0 -or @(git status --porcelain=v1 --untracked-files=all).Count -ne 0) { throw 'Checkout changed' }
          Get-ChildItem -LiteralPath $evidence -File | Where-Object { $_.Extension -in @('.log', '.exit', '.json') } |
              ForEach-Object { $_.Name + ' SHA256=' + (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash } |
              Set-Content -LiteralPath (Join-Path $evidence 'evidence-sha256.log')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p268-p96-remediation-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/p268-evidence-${{ matrix.arch }}/*.log
            ${{ runner.temp }}/p268-evidence-${{ matrix.arch }}/*.exit
            ${{ runner.temp }}/p268-evidence-${{ matrix.arch }}/*.json
          if-no-files-found: error
