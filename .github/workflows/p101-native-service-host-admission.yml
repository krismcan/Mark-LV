name: P101 Nondeployable Native Service Host Admission Candidate (x64 HOLD)

on:
  push:
    branches:
      - byok-c1-p101-service-host-admission-candidate-20261107

permissions:
  contents: read

jobs:
  windows-x64-review:
    name: Original 11-file denial baseline + P101 10-file host substitution / Windows x64 Py ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - name: Set up pinned Windows Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Clone exact P99 child, five-file additive candidate, intact 11 P49 originals
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git -c core.autocrlf=false clone --quiet --single-branch --branch byok-c1-p101-service-host-admission-candidate-20261107 https://github.com/krismcan/Mark-LV.git reviewed
          if ($LASTEXITCODE -ne 0) { throw 'P101 exact branch clone failed' }
          git -C reviewed config --local core.autocrlf false
          $head=(git -C reviewed rev-parse HEAD).Trim()
          $parent=(git -C reviewed rev-list --parents -n 1 HEAD).Trim()
          if ($head -ne $env:GITHUB_SHA) { throw 'P101 SHA does not match trigger' }
          if ($parent -ne ($head + ' bafd4030dff619d0273696dcffbfb1159b76c778')) { throw 'P101 corrective commit not an exact initial P101 child' }
          $grandparent=(git -C reviewed rev-parse 'HEAD^^').Trim()
          if ($grandparent -ne '57eb2836a0739b8657b98dc320b6806c7fe639c5') { throw 'P101 baseline no longer exact P99' }
          $expected=@('.github/workflows/p101-native-service-host-admission.yml',
                      'docs/byok-c1-p101-service-host-candidate-review.md',
                      'native_c1_candidate/CustodyService.cs',
                      'native_c1_candidate/ServiceOwnedAdmissionBoundary.cs',
                      'native_c1_candidate/ServiceHostAdmissionTests.cs') | Sort-Object
          $actual=@(git -C reviewed diff --name-only 57eb2836a0739b8657b98dc320b6806c7fe639c5 HEAD | Sort-Object)
          if (@(Compare-Object -ReferenceObject $expected -DifferenceObject $actual).Count -ne 0) { throw 'Unapproved cumulative P101 source delta' }
          $workflowOnly=@(git -C reviewed diff-tree --no-commit-id --name-only -r HEAD)
          if ($workflowOnly.Count -ne 1 -or $workflowOnly[0] -ne '.github/workflows/p101-native-service-host-admission.yml') { throw 'P101 correction changed more than CI workflow' }
          $original=@{
            'CustodyJournalFile.cs'='483CB220068FE34E28C7D1C58DBC4B6546E9226FC1899B62FAFEE912B6EBF939'
            'CustodyLedger.cs'='93A5EEEC6EE6CC4F6FFF5146B5709F57CBDD37559D62DE0BD4691BF678D5CE0B'
            'CustodyRegistryAnchor.cs'='AB17A58C9558F0AC05AE7602093FA8338CEDCC91A85DB736A871FDEBF17F7C71'
            'CustodyService.cs'='49217E9018AB2437D3F2B4B2907C08946432352618EDEE065F734D88B93EC093'
            'PendingCustodyTransaction.cs'='D8B8E4C6D5EA5E035B58C6AD73DD758C16640167C804CCF3305969B12BDF81AB'
            'PendingServiceState.cs'='B194EE6809BEB84502D9CF509D44237E1A2C24D3905F3764DC4DCA425BAB793E'
            'PendingWinCredStore.cs'='4051A48F3062A737D0D9CE212DB9B302C2C22D5ECA2893CE27B35C740A72B93C'
            'ProtectedAcl.cs'='7152A0DB081EE9627B0F8E4D0D0230168FBF194752F3180DC884C694199AEC61'
            'RecoveryReader.cs'='AF2A0BA2F680DAE0A2ACAA4EF626838A20C23001F76799372D9444EE4D50A650'
            'ServiceCustodyMutex.cs'='2C1BD0DFA679D7C97CF124A0F6612E0DA8EE533EADCF29515E233C5EA214F7BE'
            'ServiceGate.cs'='F65EF9F04283B6CA82D42B8D61B6B99B23262DE62E248DC575C0CEF1B3D96B8D'
          }
          foreach ($kv in $original.GetEnumerator()) {
            $path=Join-Path 'reviewed/tests/p99_original_native_c1_denial' $kv.Key
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash -ne $kv.Value) { throw 'Frozen original P49 CSharp source altered' }
          }
          git -C reviewed diff --check 57eb2836a0739b8657b98dc320b6806c7fe639c5 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace invalid' }
          if (@(git -C reviewed status --porcelain=v1 --untracked-files=all).Count -ne 0) { throw 'Source checkout dirty' }
          Write-Output "P101_EXACT_GITHUB_HEAD=$head"
          Write-Output 'P101_ALL_11_FROZEN_ORIGINAL_NATIVE_FILES=UNCHANGED'
          Write-Output 'P101_SOURCE_DELTA=FIVE_ADDITIVE_REVIEW_ONLY'
          Write-Output 'P101_COMMIT_CHAIN=ORIGINAL_P101_PLUS_WORKFLOW_ONLY_CORRECTION'
      - name: Compare unchanged original full-service deny gate on native x64
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $csc='C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $dir=(Resolve-Path -LiteralPath 'reviewed/tests/p99_original_native_c1_denial').Path
          $sources=@(Get-ChildItem -LiteralPath $dir -File -Filter '*.cs' | ForEach-Object {$_.FullName})
          if ($sources.Count -ne 12) { throw 'Expected original 11 plus original test' }
          $exe=Join-Path $env:RUNNER_TEMP 'P101_Baseline_OriginalFullService_x64.exe'
          $output=(& $csc /nologo /target:exe /platform:x64 /r:System.ServiceProcess.dll /main:P99FullOriginalNativeDenialTests "/out:$exe" $sources 2>&1|Out-String)
          if ($LASTEXITCODE -ne 0 -or -not [String]::IsNullOrWhiteSpace($output)) { throw 'Original service baseline CSharp compilation changed' }
          $result=(& $exe 2>&1|Out-String)
          if ($LASTEXITCODE -ne 0 -or $result -notmatch 'P99_ORIGINAL_NATIVE_DENIAL_TESTS_PASSED=20' -or
              $result -notmatch 'P99_ORIGINAL_NATIVE_DENIAL_TESTS_FAILED=0') { throw 'Original service denial baseline failed' }
          Write-Output 'P101_FROZEN_ORIGINAL_SERVICE_DENIAL=20_PASS'
      - name: Compile host-substituted real native source, deny every request on Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $csc='C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $dir=(Resolve-Path -LiteralPath 'reviewed/tests/p99_original_native_c1_denial').Path
          $candidate=(Resolve-Path -LiteralPath 'reviewed/native_c1_candidate').Path
          $oldTen=@(Get-ChildItem -LiteralPath $dir -File -Filter '*.cs' |
                    Where-Object { $_.Name -ne 'CustodyService.cs' -and $_.Name -ne 'FullOriginalNativeDenialTests.cs' } |
                    ForEach-Object { $_.FullName })
          if ($oldTen.Count -ne 10) { throw 'P101 candidate must use exactly 10 frozen P49 units' }
          $candidateHost=Join-Path $candidate 'CustodyService.cs'
          $fence=Join-Path $candidate 'ServiceOwnedAdmissionBoundary.cs'
          $tests=Join-Path $candidate 'ServiceHostAdmissionTests.cs'
          $source=Get-Content -LiteralPath $fence -Raw
          if ($source -match 'DllImport|CredWrite\s*\(|CredDelete\s*\(|CredRead\s*\(|System\.IO\.File|RegistryKey|NamedPipeServerStream|HttpListener') {
            throw 'Service-owned candidate contains forbidden native effect or IPC code'
          }
          $exe=Join-Path $env:RUNNER_TEMP 'P101_QuarantinedNativeHost_x64.exe'
          $output=(& $csc /nologo /target:exe /platform:x64 /r:System.ServiceProcess.dll /main:P101ServiceHostAdmissionTests "/out:$exe" $oldTen $candidateHost $fence $tests 2>&1|Out-String)
          if ($LASTEXITCODE -ne 0 -or -not [String]::IsNullOrWhiteSpace($output)) { throw 'P101 native host-substitution CSharp compile diagnostics' }
          Write-Output 'P101_X64_CSHARP_NATIVE_COMPILER_EXIT=0'
          for($i=1;$i -le 5;$i++) {
            $result=(& $exe 2>&1|Out-String)
            if ($LASTEXITCODE -ne 0 -or
                $result -notmatch 'P101_CANDIDATE_NATIVE_HOST_TESTS_PASSED=24' -or
                $result -notmatch 'P101_CANDIDATE_NATIVE_HOST_TESTS_FAILED=0' -or
                $result -notmatch 'P101_CORRECTED_PRODUCTION_EFFECT_DISPATCH=NOT_IMPLEMENTED' -or
                $result -notmatch 'P101_WINCRED_EFFECTS=NONE' -or
                $result -notmatch 'P101_C1_PRODUCTION_RELEASE=HOLD') {
              throw 'Native P101 host candidate refusal invariant failed'
            }
          }
          Write-Output 'P101_HOST_CANDIDATE_NATIVE_X64_RUNS=5'
          Write-Output 'P101_HOST_CANDIDATE_NATIVE_X64_CASE_EXECUTIONS=120'
          Write-Output 'P101_HOST_CANDIDATE_NATIVE_X64_EXIT=0'
      - name: Preserve original flawed C# negative proof and separate corrected model
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $csc='C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $ledger=(Resolve-Path -LiteralPath 'reviewed/tests/p99_original_native_c1_denial/CustodyLedger.cs').Path
          $old=(Resolve-Path -LiteralPath 'reviewed/tests/p99_original_native_c1_denial/PendingCustodyTransaction.cs').Path
          $cases=(Resolve-Path -LiteralPath 'reviewed/tests/p96_native_transaction_negative/NativeTransactionRaceProof.cs').Path
          $exe=Join-Path $env:RUNNER_TEMP 'P101_P96_Negative_OriginalSource_x64.exe'
          & $csc /nologo /target:exe /platform:x64 "/out:$exe" $ledger $old $cases
          if ($LASTEXITCODE -ne 0) { throw 'Native original race compile failed' }
          $result=(& $exe 2>&1|Out-String)
          if ($LASTEXITCODE -ne 0 -or $result -notmatch 'P96_NATIVE_ACTUAL_COORDINATOR_TESTS_PASSED=15' -or
              $result -notmatch 'P96_LEGACY_POST_CHECK_REVOCATION_RACE=REPRODUCED_IN_FAKE_ONLY') { throw 'Original flawed coordinator evidence differs' }
          Write-Output 'P101_ORIGINAL_NATIVE_CONSENT_TO_EFFECT_GAP=OPEN_REPRODUCED'
          $new=(Resolve-Path -LiteralPath 'reviewed/tests/p97_disabled_admission_remedy/DisabledNativeAdmissionCoordinator.cs').Path
          $newCases=(Resolve-Path -LiteralPath 'reviewed/tests/p97_disabled_admission_remedy/DisabledAdmissionRaceTests.cs').Path
          $exe2=Join-Path $env:RUNNER_TEMP 'P101_P97_SeparateDisabledCorrected_x64.exe'
          & $csc /nologo /target:exe /platform:x64 "/out:$exe2" $ledger $new $newCases
          if ($LASTEXITCODE -ne 0) { throw 'P97 corrected model compile failed' }
          $result=(& $exe2 2>&1|Out-String)
          if ($LASTEXITCODE -ne 0 -or $result -notmatch 'P97_DISABLED_NATIVE_RACE_TESTS_PASSED=40') { throw 'P97 model not passing' }
          Write-Output 'P101_SEPARATE_DISABLED_P97_ORDERING=40_PASS_NOT_PRODUCTION'
      - name: Existing Python Windows affected regressions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location reviewed
          try {
            python -B -m unittest -q tests.test_p93_disposable_crash_recovery tests.test_pending_credential_recovery_document tests.test_p91_disabled_admission_model tests.test_p88_pending_observation_lifecycle tests.test_p87_readonly_custody_observation tests.test_p86_live_pending_status_integration tests.test_pending_custody_status_view tests.test_first_run_connection_application tests.test_first_run_connection_window tests.test_first_run_connection_effect_isolation tests.test_phase_830_workspace tests.test_phase_831_workspace tests.test_first_run_connection_cancelled_effect
            if ($LASTEXITCODE -ne 0) { throw 'Affected Python regressions failed' }
            Write-Output 'P101_AFFECTED_PYTHON_WINDOWS_NATIVE_EXIT=0'
          } finally { Pop-Location }
      - name: Explicitly retain historical P62, Windows x86 policy, real service and release holds
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ((git -C reviewed rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Source drift' }
          if (@(git -C reviewed status --porcelain=v1 --untracked-files=all).Count -ne 0) { throw 'Dirty source checkout' }
          Write-Output 'P101_ORIGINAL_P49_NATIVE_SOURCE=UNCHANGED'
          Write-Output 'P101_ORIGINAL_P61_NATIVE_CONSENT_RACE=OPEN'
          Write-Output 'P101_HOST_CANDIDATE_HAS_NO_DISPATCH=TRUE'
          Write-Output 'P101_KRISTIAN_X86_APP_CONTROL=BLOCKED_UNVERIFIED'
          Write-Output 'P101_OPENAI_P62_RESTRICTION=UNTOUCHED'
          Write-Output 'P101_QUALIFIED_INDEPENDENT_SECURITY_REVIEW=NOT_RECEIVED'
          Write-Output 'P101_PRODUCTION_NATIVE_CREDENTIAL_EFFECTS=NONE'
          Write-Output 'P101_BYOK_C1_PRODUCTION_RELEASE=HOLD'
