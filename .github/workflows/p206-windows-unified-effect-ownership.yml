name: P206 Genuine Windows Legacy Python/Native Credential Ownership HOLD
on:
  push:
    branches:
      - byok-c1-p206-unified-credential-effect-ownership-20261114
permissions:
  contents: read
jobs:
  windows-effect-ownership:
    name: P206 Legacy Fake Bypass, Dormant Hold, P49 20 and C1 Native 24
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout authenticated exact event commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install genuine Windows Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve P205 native test dependency only
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check cryptography==46.0.4
          if ($LASTEXITCODE -ne 0) { throw 'Original P205 native fixture prerequisite unavailable; HOLD' }
      - name: Prove original source and execute source-bound Python/native Windows tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_OS -ne 'Windows' -or
              $env:GITHUB_EVENT_NAME -ne 'push' -or
              $env:GITHUB_REPOSITORY -ne 'krismcan/Mark-LV' -or
              $env:GITHUB_REF_NAME -ne 'byok-c1-p206-unified-credential-effect-ownership-20261114') {
            throw 'P206 requires actual Windows GitHub source-event trust'
          }
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) {
            throw 'P206 checkout does not match event commit'
          }
          $env:PYTHONDONTWRITEBYTECODE='1'
          python -B -m scripts.p206_windows_credential_effect_ownership
          if ($LASTEXITCODE -ne 0) {
            throw 'P206 native Windows original-source and isolated effect-holder evidence failed: HOLD'
          }
          Write-Output 'P206_REALKEY_GATE=NO_GO'
          Write-Output 'P206_PRODUCTION_RELEASE=HOLD'
          Write-Output 'P206_REAL_WINCRED_EFFECTS_PERFORMED=ZERO'
          Write-Output 'P206_THREE_FULL_UNFILTERED_WINDOWS_ACCEPTED_REGRESSIONS=0/3'
      - name: Archive original OS logs, SHA ledger and CSharp compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p206-Windows-original-Python-native-effect-HCR-HOLD
          path: |
            ${{ runner.temp }}/nayeon-p206-effect-ownership/*.log
            ${{ runner.temp }}/nayeon-p206-effect-ownership/*.json
            ${{ runner.temp }}/nayeon-p205-key-gates/*.log
          if-no-files-found: warn
          retention-days: 14
